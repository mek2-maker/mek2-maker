<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>2020년 시도별 인구 상위 10개 지역</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: sans-serif;
      margin: 20px;
      padding: 0;
      background-color: #f8f8f8;
    }
    h2 {
      font-size: 2vw; /* 뷰포트 크기에 따라 반응형 크기 */
      text-align: center;
      background-color: #d3d3d3;
      padding: 1em;
      border-radius: 8px;
      max-width: 90%;
      margin: 0 auto 30px auto;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .chart-container {
      width: 95%;
      height: 60vh; /* 화면 높이 기준으로 비율 지정 */
      margin: 0 auto;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <h2>2020년 시도별 인구 상위 10개 지역 (엑셀 데이터 기반)</h2>
  <div class="chart-container">
    <canvas id="populationChart"></canvas>
  </div>

  <script>
    const labels = [
      "경기도", "서울특별시", "부산광역시", "경상남도", "인천광역시",
      "경상북도", "대구광역시", "충청남도", "전라남도", "전북특별자치도"
    ];
    const data = [
      13427014, 9668465, 3391946, 3340216, 2942828,
      2639422, 2418346, 2121029, 1851549, 1804104
    ];

    const ctx = document.getElementById('populationChart').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [{
          label: '인구 수',
          data: data,
          backgroundColor: 'rgba(75, 192, 192, 0.7)'
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false }
        },
        scales: {
          x: {
            ticks: {
              callback: function(value) {
                return value.toLocaleString() + '명';
              }
            },
            title: {
              display: true,
              text: '인구 수'
            }
          },
          y: {
            title: {
              display: true,
              text: '지역'
            }
          }
        }
      }
    });
  </script>
</body>
</html>
