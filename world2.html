<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>3D 지구본 + 국기 & 정보 패널</title>
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
    style-src 'self' 'unsafe-inline';
  ">
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
  <style>
    body { margin:0; overflow:hidden; }
    #overlay { position:absolute; top:10px; left:10px; background:#fff; padding:10px; border-radius:4px; font-family:sans-serif; }
    #info-panel { position:absolute; bottom:0; left:0; width:100%; height:250px; display:flex; background:rgba(255,255,255,0.95); font-family:sans-serif; }
    #info-panel .info { flex:1; padding:8px; text-align:center; overflow:auto; }
    #info-panel img { max-width:80px; display:block; margin:0 auto 4px; }
  </style>
</head>
<body>
  <div id="overlay">
    <input id="iso-code" placeholder="국가명 입력">
    <button id="searchBtn">검색</button>
  </div>
  <div id="info-panel">
    <div id="left-info" class="info"></div>
    <div id="right-info" class="info"></div>
  </div>

  <script type="module">
    import * as THREE from './libs/three.module.js';
    import { OrbitControls } from './libs/OrbitControls.js';
    import earcut from './libs/earcut.js';
    import TWEEN from './libs/tween.esm.js';

    let scene, camera, renderer, controls;
    let geoJSON, infoData, currentBoundaryLine, currentFillMesh, koreaBoundaryLine, koreaFillMesh;
    const R = 1;

    async function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
      renderer = new THREE.WebGLRenderer({ antialias:true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);
      controls = new OrbitControls(camera, renderer.domElement);
      controls.rotateSpeed = 0.3;  // 회전 속도 조절: 값이 작을수록 느리게 회전합니다.

      const globe = new THREE.Mesh(
        new THREE.SphereGeometry(R,64,64),
        new THREE.MeshBasicMaterial({ map:new THREE.TextureLoader().load('eo_base_2020_clean_geo_optimized.jpg') })
      );
      scene.add(globe);

      geoJSON = await (await fetch('countries.geojson')).json();
      infoData = Papa.parse(await (await fetch('country_info.csv')).text(), { header:true, skipEmptyLines:true }).data;

      const korea = geoJSON.features.find(f => f.properties.ADMIN.toLowerCase().includes('korea'));
      drawKorea(korea);
      updateLeftPanel();

      document.getElementById('searchBtn').onclick = searchCountries;

      // 초기 카메라 위치를 대한민국 중심으로 이동
      const center = getCenterOfFeature(korea);
      const pos = lonLatToXYZ(center.centerLon, center.centerLat, R + 0.4);
      camera.position.copy(pos);
      controls.target.set(0, 0, 0);

      animate();
    }

    function animate(time) {
      requestAnimationFrame(animate);
      TWEEN.update(time);
      controls.update();
      renderer.render(scene, camera);
    }

    function lonLatToXYZ(lon, lat, r) {
      const phi = (90 - lat)*Math.PI/180, theta = (lon+180)*Math.PI/180;
      return new THREE.Vector3(-r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
    }

    function updateLeftPanel() {
      const left = document.getElementById('left-info');
      const korea = infoData.find(i => (i.Name||'').toLowerCase().includes('korea'));
      left.innerHTML = korea
        ? `<img src="./flag/${korea.ISO2}.jpg">
           <strong>${korea.Name}</strong><br>
           수도: ${korea.Capital}<br>
           면적: ${korea.Area || '정보 없음'}<br>
           인구: ${korea.Population}<br>
           GDP: ${korea.GDP}`
        : '대한민국 정보 없음';
    }

    function updateRightPanel(name) {
      const right = document.getElementById('right-info');
      const info = infoData.find(i => (i.Name || '').toLowerCase().includes(name.toLowerCase()));
      right.innerHTML = info
        ? `<img src="./flag/${info.ISO2}.gif"
                 onerror="this.onerror=null;this.src='./flag/${info.ISO2}.jpg';this.onerror=e=>e.target.src='./flag/${info.ISO2}.png';"
                 alt="${info.Name}">
           <strong>${info.Name}</strong><br>
           수도: ${info.Capital}<br>
           면적: ${info.Area || '정보 없음'}<br>
           인구: ${info.Population}<br>
           GDP: ${info.GDP}`
        : '국가 정보 없음';
    }

    function drawPolygonFillWithRadius(feature, colorHex, radius) {
      const meshGroup = new THREE.Group();
      const geom = feature.geometry;
      const bounds = getCenterOfFeature(feature);
    
      const draw = coords => {
        const outer = polygonToSphereMesh([coords[0]], bounds, radius, colorHex);
        if (outer) meshGroup.add(outer);
    
        for (let i = 1; i < coords.length; i++) {
          const holePoly = polygonToSphereMesh([coords[i]], bounds, radius, colorHex);
          if (holePoly) meshGroup.add(holePoly);
        }
      };
    
      if (geom.type === 'Polygon') draw(geom.coordinates);
      else if (geom.type === 'MultiPolygon') geom.coordinates.forEach(draw);
    
      return meshGroup;
    }

    function polygonToSphereMesh(coordsArray, bounds, radius, colorHex) {
      const [outerRing] = coordsArray;
      if (!outerRing || outerRing.length < 3) return null;

      const { minLon, maxLon, minLat, maxLat, centerLon, centerLat } = bounds;
      const outer2D = toLocal2D(outerRing, centerLon, centerLat);
      const verts2D = [], indices = [], uvs = [];

      outer2D.forEach(p => verts2D.push(p[0], p[1]));
      const idx = earcut(verts2D, [], 2);

      const positions = [];
      for (let i = 0; i < idx.length; i++) {
        const index = idx[i];
        const x2D = verts2D[index * 2];
        const y2D = verts2D[index * 2 + 1];
        const lon = centerLon + (x2D / (Math.PI/180));
        const lat = centerLat + (y2D / (Math.PI/180));
        const v3 = lonLatToXYZ(lon, lat, radius);
        positions.push(v3.x, v3.y, v3.z);

        const u = (lon - minLon) / (maxLon - minLon);
        const v = (lat - minLat) / (maxLat - minLat);
        uvs.push(u, v);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geometry.computeVertexNormals();

      const material = new THREE.MeshBasicMaterial({ color: colorHex, transparent:true, opacity:0.5, side:THREE.DoubleSide });
      return new THREE.Mesh(geometry, material);
    }

    function toLocal2D(ring, cLon, cLat) {
      const degToRad = Math.PI / 180;
      return ring.map(([lon, lat]) => [(lon - cLon) * degToRad, (lat - cLat) * degToRad]);
    }

    function getCenterOfFeature(feature) {
      let minLon = 180, maxLon = -180, minLat = 90, maxLat = -90;
      feature.geometry.coordinates.flat(2).forEach(([lon, lat]) => {
        minLon = Math.min(minLon, lon);
        maxLon = Math.max(maxLon, lon);
        minLat = Math.min(minLat, lat);
        maxLat = Math.max(maxLat, lat);
      });
      const centerLon = (minLon + maxLon) / 2;
      const centerLat = (minLat + maxLat) / 2;
      return { minLon, maxLon, minLat, maxLat, centerLon, centerLat };
    }

    function drawKorea(feature) {
      // 경계선은 약간 바깥쪽 (R + 0.02)
      koreaBoundaryLine = drawBoundaryWithRadius(feature, 0x0000ff, R + 0.02);
      scene.add(koreaBoundaryLine);
    
      // 다중 폴리곤일 경우 겹침 방지를 위해 각 폴리곤마다 조금씩 다른 반지름 사용
      koreaFillMesh = new THREE.Group();
      const coordsArray = feature.geometry.coordinates;
    
      coordsArray.forEach((polygon, idx) => {
        const singleFeature = {
          type: "Feature",
          properties: feature.properties,
          geometry: {
            type: "Polygon",
            coordinates: polygon
          }
        };
        const radiusOffset = 0.005 + (idx % 3) * 0.005;  // R+0.01, R+0.015, R+0.02
        const mesh = drawPolygonFillWithRadius(singleFeature, 0x0000ff, R + radiusOffset);
        if (mesh) koreaFillMesh.add(mesh);
      });
    
      scene.add(koreaFillMesh);
    }

    function drawBoundaryWithRadius(feature, colorHex, radius) {
      const group = new THREE.Group();
      const geom = feature.geometry;
    
      const draw = ring => {
        const pts = ring.map(([lon, lat]) => lonLatToXYZ(lon, lat, radius));
        group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: colorHex })));
      };
    
      if (geom.type === 'Polygon') geom.coordinates.forEach(draw);
      else geom.coordinates.flat().forEach(draw);
    
      return group;
    }

    function searchCountries() {
      const name = document.getElementById('iso-code').value.trim().toLowerCase();
      const match = geoJSON.features.find(f => f.properties.ADMIN.toLowerCase().includes(name));
      if (!match) return alert('검색 결과 없음');
      displayCountry(match);
    }

    function displayCountry(feature) {
      if (currentBoundaryLine) scene.remove(currentBoundaryLine);
      if (currentFillMesh) scene.remove(currentFillMesh);

      currentBoundaryLine = drawBoundary(feature, 0xff0000);
      currentFillMesh = drawPolygonFill(feature, 0xff0000);
      scene.add(currentBoundaryLine);
      scene.add(currentFillMesh);

      updateRightPanel(feature.properties.ADMIN);

      const center = getCenterOfFeature(feature);
      const pos = lonLatToXYZ(center.centerLon, center.centerLat, R + 0.4);
      new TWEEN.Tween(camera.position)
        .to({ x: pos.x*1.5, y: pos.y*1.5, z: pos.z*1.5 }, 1000)
        .easing(TWEEN.Easing.Quadratic.Out)
        .onUpdate(() => controls.update())
        .start();
    }

    window.onload = init;
  </script>
</body>
</html>
