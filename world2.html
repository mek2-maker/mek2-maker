<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>3D 지구본 (경계선 내부 국기 표시, South Korea 경계 유지)</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline';">
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(255,255,255,0.9);
      padding: 10px;
      border-radius: 5px;
      font-family: sans-serif;
      width: 300px;
      max-width: 80vw;
      box-sizing: border-box;
    }
    #results {
      margin-top: 10px;
      max-height: 150px;
      overflow-y: auto;
    }
    .result-item {
      padding: 5px;
      border-bottom: 1px solid #ccc;
      cursor: pointer;
    }
    .result-item:hover { background-color: #eee; }
    #overlay input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 5px;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <label for="iso-code">국가명 검색 (예: Korea, China):</label>
    <input type="text" id="iso-code" placeholder="국가명을 입력하세요">
    <button id="searchBtn">검색</button>
    <div id="results"></div>
  </div>

  <script type="module">
    import * as THREE from './libs/three.module.js';
    import { OrbitControls } from './libs/OrbitControls.js';
    import TWEEN from './libs/tween.esm.js';
    import earcut from './libs/earcut.js';

    let scene, camera, renderer, controls;
    const globeRadius = 1;
    let globeMesh;
    let countryGeoJSON = null;

    // 현재 장면에 표시된 국기/경계 Mesh
    let currentFlagMesh = null;
    let currentBoundaryLine = null;
    let koreaBoundaryLine = null;

    // 헬퍼 함수들
    function getISO2(feature) {
      const iso2 = feature.properties.ISO_A2;
      return iso2 ? iso2.trim() : null;
    }
    function getCountryName(feature) {
      return feature.properties.ADMIN;
    }
    function lonLatToXYZ(lon, lat, radius = globeRadius) {
      const phi = (90 - lat) * (Math.PI / 180);
      const theta = (lon + 180) * (Math.PI / 180);
      const x = -radius * Math.sin(phi) * Math.cos(theta);
      const z = radius * Math.sin(phi) * Math.sin(theta);
      const y = radius * Math.cos(phi);
      return new THREE.Vector3(x, y, z);
    }

    // 국기 텍스처 로드 함수
    function loadFlagTexture(iso2) {
      return new Promise((resolve, reject) => {
        if (iso2 === "??") {
          return reject("ISO2 코드가 없어 국기 이미지를 찾을 수 없음");
        }
        const exts = ['gif', 'png', 'jpg', 'bmp'];
        const basePath = './flag/';
        const loader = new THREE.TextureLoader();
        function tryLoad(i) {
          if (i >= exts.length) {
            reject(`모든 확장자를 시도했으나 '${iso2}' 국기 파일 없음`);
            return;
          }
          const url = `${basePath}${iso2}.${exts[i]}`;
          console.log("Trying to load:", url);
          loader.load(
            url,
            texture => {
              console.log("Loaded flag texture:", url);
              resolve(texture);
            },
            undefined,
            () => {
              console.warn("Failed to load:", url);
              tryLoad(i + 1);
            }
          );
        }
        tryLoad(0);
      });
    }

    // 기존 국기 Mesh 제거
    function removeOldFlagMesh() {
      if (currentFlagMesh) {
        scene.remove(currentFlagMesh);
        disposeObject(currentFlagMesh);
        currentFlagMesh = null;
      }
    }
    function disposeObject(obj) {
      obj.traverse(child => {
        if (child.isMesh) {
          child.geometry.dispose();
          if (child.material.map) child.material.map.dispose();
          child.material.dispose();
        }
      });
    }

    // ----------------------------------------------------------------
    // (1) polygonToSphereMesh: earcut를 이용해 구 표면에 맞춘 3D 폴리곤 생성  
    // 수정: 국기 Mesh를 국가 중심을 기준으로 로컬 좌표로 생성하기 위해 centerPos를 사용
    // ----------------------------------------------------------------
    function polygonToSphereMesh(coordsArray, radius = globeRadius + 0.02) {
      // coordsArray: [ [ [lon, lat], ... ],  // outer ring
      //                [ [lon, lat], ... ],  // hole ring
      //                ... ]
      
      // 1) earcut을 위한 2D 투영
      //    (기존에는 centerLon, centerLat을 빼서 로컬화했지만 이제는 제거)
      //    굳이 2D 변환할 필요가 없다면, lonLatToXYZ로 바로 삼각화할 수도 있음
      //    여기서는 간단히 earcut용 2D만 만들고, 최종 좌표는 lonLatToXYZ로 처리
      
      // ... 기존 2D ring 생성 과정 ...
      
      // 2) earcut로 인덱스 생성 후, 각 정점을 lonLatToXYZ로 변환

        const idx = indices[i];
        const x2D = verts2D[idx * 2];
        const y2D = verts2D[idx * 2 + 1];
        
        // ---- 기존 코드에서 centerLon/centerLat을 더해 realLon/realLat 만든 뒤
        //      worldPos = lonLatToXYZ(...) → localPos = worldPos.sub(centerPos)
        //      이런 과정을 했지만, 이제는 그냥 lon/lat 자체를 바로 변환.
        //      (혹은 earcut로 2D를 만들지 않고 ring[i]에서 직접 lonLatToXYZ)
        
        const realLon = /* earcut 2D -> 실제 lon 변환 */;
        const realLat = /* earcut 2D -> 실제 lat 변환 */;
        
        const worldPos = lonLatToXYZ(realLon, realLat, radius);
        positions.push(worldPos.x, worldPos.y, worldPos.z);
        
        // UV 좌표는 필요하다면 minLon, maxLon 등으로 계산
        // uvs.push(...);
      }
    
      // 3) geometry 완성 후, MeshBasicMaterial로 폴리곤 생성
      //    여기서 별도의 회전/position 설정은 없음
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute(...);
      geometry.computeVertexNormals();
      
      const material = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.6
      });
      
      const mesh = new THREE.Mesh(geometry, material);
      return mesh;
    }

    // 로컬 2D 변환 함수: (lon, lat)에서 (centerLon, centerLat)를 빼고 도->라디안 변환
    function toLocal2D(ring, cLon, cLat) {
      const degToRad = Math.PI / 180;
      return ring.map(([lon, lat]) => {
        const dx = (lon - cLon) * degToRad;
        const dy = (lat - cLat) * degToRad;
        return [dx, dy];
      });
    }

    // ----------------------------------------------------------------
    // (2) createFlagShape: 국기 모양 생성 및 국가 중심에 맞게 배치  
    // 수정: meshGroup 내의 정점들을 로컬 좌표로 구성한 후, 그룹의 position을 국가 중심으로 설정
    // ----------------------------------------------------------------
    async function createFlagShape(feature, iso2) {
      // 1) polygonToSphereMesh를 호출해서 '절대 좌표'로 폴리곤 생성
      const meshGroup = new THREE.Group();
      if (geom.type === 'Polygon') {
        const mesh = polygonToSphereMesh(geom.coordinates);
        if (mesh) meshGroup.add(mesh);
      } else if (geom.type === 'MultiPolygon') {
        ...
      }
    
      // 2) 국기 텍스처만 적용
      const flagTex = await loadFlagTexture(iso2);
      meshGroup.traverse(obj => {
        if (obj.isMesh) {
          obj.material.map = flagTex;
          obj.material.needsUpdate = true;
        }
      });
    
      // 3) meshGroup에 별도 이동/회전 없음
      // meshGroup.setRotationFromMatrix(...) 제거
      // meshGroup.position.copy(centerPos) 제거
    
      return meshGroup;
    }

    // ----------------------------------------------------------------
    // (3) getBoundsCenter: bbox 중심(모든 좌표의 산술 평균)으로 계산합니다.
    // ----------------------------------------------------------------
    function getBoundsCenter(feature) {
      let minLon = 180, maxLon = -180, minLat = 90, maxLat = -90;
      const geom = feature.geometry;
      if (geom.type === 'Polygon') {
        geom.coordinates.forEach(ring => {
          ring.forEach(([lon, lat]) => {
            if (lon < minLon) minLon = lon;
            if (lon > maxLon) maxLon = lon;
            if (lat < minLat) minLat = lat;
            if (lat > maxLat) maxLat = lat;
          });
        });
      } else if (geom.type === 'MultiPolygon') {
        geom.coordinates.forEach(poly => {
          poly.forEach(ring => {
            ring.forEach(([lon, lat]) => {
              if (lon < minLon) minLon = lon;
              if (lon > maxLon) maxLon = lon;
              if (lat < minLat) minLat = lat;
              if (lat > maxLat) maxLat = lat;
            });
          });
        });
      }
      const centerLon = (minLon + maxLon) / 2;
      const centerLat = (minLat + maxLat) / 2;
      const centerPos = lonLatToXYZ(centerLon, centerLat, globeRadius + 0.02);
      return { minLon, maxLon, minLat, maxLat, centerLon, centerLat, centerPos };
    }

    // ----------------------------------------------------------------
    // 초기화 및 애니메이션
    // ----------------------------------------------------------------
    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(2, 2, 2);
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);
      controls = new OrbitControls(camera, renderer.domElement);
      controls.rotateSpeed = 0.3;
      controls.zoomSpeed = 1.2;
      controls.panSpeed = 1.0;
      controls.update();
      // 지구본 생성
      const sphereGeometry = new THREE.SphereGeometry(globeRadius, 64, 64);
      const textureLoader = new THREE.TextureLoader();
      const globeTexture = textureLoader.load('eo_base_2020_clean_geo_optimized.jpg');
      const sphereMaterial = new THREE.MeshBasicMaterial({ map: globeTexture });
      globeMesh = new THREE.Mesh(sphereGeometry, sphereMaterial);
      scene.add(globeMesh);
      // countries.geojson 로드
      fetch('countries.geojson')
        .then(response => response.json())
        .then(data => {
          countryGeoJSON = data;
          document.getElementById('iso-code').value = "south korea";
          searchCountries(); // 초기 로딩 시 한국 표시
        })
        .catch(err => console.error('GeoJSON 로드 실패:', err));
      animate();
    }

    function animate(time) {
      requestAnimationFrame(animate);
      TWEEN.update(time);
      controls.update();
      renderer.render(scene, camera);
    }

    // ----------------------------------------------------------------
    // 검색 및 국가 표시
    // ----------------------------------------------------------------
    function searchCountries() {
      const searchTerm = document.getElementById('iso-code').value.trim().toLowerCase();
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = "";
      if (!countryGeoJSON) {
        alert("GeoJSON 데이터가 아직 로드되지 않았습니다.");
        return;
      }
      const matches = countryGeoJSON.features.filter(feature => {
        return getCountryName(feature).toLowerCase().includes(searchTerm);
      });
      if (matches.length === 0) {
        resultsDiv.innerHTML = "<div>검색 결과가 없습니다.</div>";
        return;
      }
      if (matches.length === 1) {
        document.getElementById('iso-code').value = getCountryName(matches[0]);
        displayCountry(matches[0]);
        resultsDiv.innerHTML = "";
      } else {
        matches.forEach(feature => {
          const div = document.createElement('div');
          div.className = "result-item";
          const iso2 = getISO2(feature) || "??";
          div.textContent = `${getCountryName(feature)} (${iso2})`;
          div.addEventListener('click', () => {
            displayCountry(feature);
            resultsDiv.innerHTML = "";
            document.getElementById('iso-code').value = getCountryName(feature);
          });
          resultsDiv.appendChild(div);
        });
      }
    }

    function displayCountry(feature) {
      drawCountryBoundary(feature);
      const iso2 = getISO2(feature) || "??";
      createFlagShape(feature, iso2)
        .then(flagMesh => {
          removeOldFlagMesh();
          currentFlagMesh = flagMesh;
          scene.add(currentFlagMesh);
          // 디버그용 BoxHelper (필요시 제거 가능)
          const boxHelper = new THREE.BoxHelper(currentFlagMesh, 0xff00ff);
          scene.add(boxHelper);
          console.log("BoxHelper added to scene for debugging.");
        })
        .catch(err => console.warn("국기 Shape 생성 실패:", err));
      // 카메라 이동 (bbox 중심 사용)
      const { centerPos } = getBoundsCenter(feature);
      new TWEEN.Tween(camera.position)
        .to({ x: centerPos.x * 2.2, y: centerPos.y * 2.2, z: centerPos.z * 2.2 }, 1000)
        .easing(TWEEN.Easing.Quadratic.Out)
        .onComplete(() => {
          controls.target.copy(centerPos);
          controls.update();
        })
        .start();
    }

    // ----------------------------------------------------------------
    // 경계선(Line) 표시 (South Korea는 항상 유지)
    // ----------------------------------------------------------------
    function drawCountryBoundary(feature) {
      const isoA3 = feature.properties.ISO_A3;
      const lineColor = (isoA3 === "KOR") ? 0x0000ff : 0xff0000;
      if (isoA3 !== "KOR" && currentBoundaryLine) {
        scene.remove(currentBoundaryLine);
        disposeObject(currentBoundaryLine);
        currentBoundaryLine = null;
      }
      if (isoA3 === "KOR") {
        if (!koreaBoundaryLine) {
          koreaBoundaryLine = createBoundaryLineGroup(feature);
          scene.add(koreaBoundaryLine);
        }
        return;
      }
      currentBoundaryLine = createBoundaryLineGroup(feature);
      scene.add(currentBoundaryLine);
    }

    function createBoundaryLineGroup(feature) {
      const lineGroup = new THREE.Group();
      const geom = feature.geometry;
      if (!geom) return lineGroup;
      const lineColor = 0xff0000;
      if (geom.type === 'Polygon') {
        geom.coordinates.forEach(ring => {
          const lineMesh = createBoundaryLineMesh(ring, lineColor);
          if (lineMesh) lineGroup.add(lineMesh);
        });
      } else if (geom.type === 'MultiPolygon') {
        geom.coordinates.forEach(poly => {
          poly.forEach(ring => {
            const lineMesh = createBoundaryLineMesh(ring, lineColor);
            if (lineMesh) lineGroup.add(lineMesh);
          });
        });
      }
      return lineGroup;
    }

    function createBoundaryLineMesh(ring, color) {
      if (!ring || ring.length < 2) return null;
      // 원본 배열 변경을 방지하기 위해 복사본 사용
      const ringCopy = ring.slice();
      if (!ringCopy[0].every((val, idx) => val === ringCopy[ringCopy.length - 1][idx])) {
        ringCopy.push(ringCopy[0]);
      }
      const points = ringCopy.map(([lon, lat]) => lonLatToXYZ(lon, lat, globeRadius + 0.02));
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const material = new THREE.LineBasicMaterial({ color });
      return new THREE.Line(geometry, material);
    }

    // 이벤트 설정
    window.onload = init;
    document.getElementById('searchBtn').addEventListener('click', searchCountries);
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
