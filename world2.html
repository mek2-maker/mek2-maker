<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>3D 지구본 + 국기 & 정보 패널</title>
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.skypack.dev;
    style-src 'self' 'unsafe-inline';
  ">
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
  <style>
    body { margin:0; overflow:hidden; }
    #overlay { position:absolute; top:10px; left:10px; background:#fff; padding:10px; border-radius:4px; font-family:sans-serif; z-index:10; }
    #results { margin-top:8px; max-height:100px; overflow:auto; }
    .result-item { padding:4px; border-bottom:1px solid #ccc; cursor:pointer; }
    .result-item:hover { background:#eee; }
    #info-panel { position:absolute; bottom:0; left:0; width:100%; height:250px; display:flex; background:rgba(255,255,255,0.95); font-family:sans-serif; z-index:5; }
    #info-panel .info { flex:1; padding:8px; text-align:center; overflow:auto; }
    #info-panel img { max-width:80px; display:block; margin:0 auto 4px; }
  </style>
</head>
<body>
  <div id="overlay">
    <input id="iso-code" placeholder="국가명 입력">
    <button onclick="searchCountries()">검색</button>
    <div id="results"></div>
  </div>

  <div id="info-panel">
    <div id="left-info" class="info"></div>
    <div id="right-info" class="info"></div>
  </div>

  <script type="module">
    import * as THREE from './libs/three.module.js';
    import { OrbitControls } from './libs/OrbitControls.js';
    import TWEEN from './libs/tween.esm.js';
    import { rewind, centroid } from 'https://cdn.skypack.dev/@turf/turf';

    let scene, camera, renderer, controls, geoJSON, infoData;
    let currentCountryMesh = null;
    let currentBoundaryLine = null;
    let koreaMesh = null;
    let koreaLine = null;
    const R = 1;

    async function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(2, 2, 2);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);

      const globe = new THREE.Mesh(
        new THREE.SphereGeometry(R, 64, 64),
        new THREE.MeshBasicMaterial({ map: new THREE.TextureLoader().load('eo_base_2020_clean_geo_optimized.jpg') })
      );
      scene.add(globe);

      geoJSON = rewind(await (await fetch('countries.geojson')).json(), { reverse: false });
      infoData = Papa.parse(await (await fetch('country_info.csv')).text(), { header: true, skipEmptyLines: true }).data;

      updateLeftPanel();

      // 대한민국 먼저 표시
      const koreaFeature = geoJSON.features.find(f => f.properties.ISO_A3 === 'KOR');
      if (koreaFeature) drawCountry(koreaFeature, 'blue', true);

      document.getElementById('iso-code').value = 'south korea';
      searchCountries();

      animate();
    }

    function animate(time) {
      requestAnimationFrame(animate);
      TWEEN.update(time);
      controls.update();
      renderer.render(scene, camera);
    }

    function updateLeftPanel() {
      const left = document.getElementById('left-info');
      const korea = infoData.find(i => (i.Name || '').toLowerCase().includes('korea'));
      left.innerHTML = korea
        ? `<img src="./flag/${korea.ISO2}.jpg"><strong>${korea.Name}</strong><br>수도: ${korea.Capital}<br>인구: ${korea.Population}<br>GDP: ${korea.GDP}`
        : '대한민국 정보 없음';
    }

    function updateRightPanel(name) {
      const right = document.getElementById('right-info');
      const info = infoData.find(i => (i.Name || '').toLowerCase().includes(name.toLowerCase()));
      right.innerHTML = info
        ? `<img src="./flag/${info.ISO2}.gif" onerror="this.onerror=null;this.src='./flag/${info.ISO2}.jpg';this.onerror=e=>e.target.src='./flag/${info.ISO2}.png';" alt="${info.Name}"><strong>${info.Name}</strong><br>수도: ${info.Capital}<br>인구: ${info.Population}<br>GDP: ${info.GDP}`
        : '국가 정보 없음';
    }

    async function searchCountries() {
      const term = document.getElementById('iso-code').value.trim().toLowerCase();
      const feat = geoJSON.features.find(f => f.properties.ADMIN.toLowerCase().includes(term));
      if (!feat) return alert('검색 결과 없음');
      drawCountry(feat, 'red');
    }

    function drawCountry(feat, color, isKorea = false) {
      const mesh = createPolygonMesh(feat, color);
      const line = createBoundaryLine(feat, color === 'blue' ? 0x0000ff : 0xff0000);

      if (isKorea) {
        koreaMesh = mesh;
        koreaLine = line;
      } else {
        if (currentCountryMesh) scene.remove(currentCountryMesh);
        if (currentBoundaryLine) scene.remove(currentBoundaryLine);
        currentCountryMesh = mesh;
        currentBoundaryLine = line;
        updateRightPanel(feat.properties.ADMIN);
      }

      scene.add(mesh);
      scene.add(line);

      const ctr = centroid(feat).geometry.coordinates;
      const pos = lonLatToXYZ(ctr[0], ctr[1], R + 0.02);
      new TWEEN.Tween(camera.position)
        .to({ x: pos.x * 2.2, y: pos.y * 2.2, z: pos.z * 2.2 }, 1000)
        .easing(TWEEN.Easing.Quadratic.Out)
        .onComplete(() => { controls.target.copy(pos); controls.update(); })
        .start();
    }

    function createPolygonMesh(feat, color) {
      const geom = feat.geometry;
      const group = new THREE.Group();
      const mat = new THREE.MeshBasicMaterial({
        color: color === 'blue' ? 0x0000ff : 0xff0000,
        opacity: 0.5,
        transparent: true,
        side: THREE.DoubleSide
      });

      const addPolygon = (ring) => {
        const shape = new THREE.Shape();
        ring.forEach(([lon, lat], i) => {
          const v = lonLatToXYZ(lon, lat, R + 0.02);
          if (i === 0) shape.moveTo(v.x, v.y);
          else shape.lineTo(v.x, v.y);
        });
        const geometry = new THREE.ShapeGeometry(shape);
        const mesh = new THREE.Mesh(geometry, mat);
        group.add(mesh);
      };

      if (geom.type === 'Polygon') geom.coordinates.forEach(addPolygon);
      else geom.coordinates.flat().forEach(addPolygon);

      return group;
    }

    function createBoundaryLine(feat, color) {
      const group = new THREE.Group();
      const mat = new THREE.LineBasicMaterial({ color });

      const addLine = ring => {
        const points = ring.map(([lon, lat]) => lonLatToXYZ(lon, lat, R + 0.02));
        const geom = new THREE.BufferGeometry().setFromPoints(points);
        group.add(new THREE.Line(geom, mat));
      };

      if (feat.geometry.type === 'Polygon') feat.geometry.coordinates.forEach(addLine);
      else feat.geometry.coordinates.flat().forEach(addLine);

      return group;
    }

    function lonLatToXYZ(lon, lat, r) {
      const phi = (90 - lat) * Math.PI / 180;
      const theta = (lon + 180) * Math.PI / 180;
      const x = -r * Math.sin(phi) * Math.cos(theta);
      const y = r * Math.cos(phi);
      const z = r * Math.sin(phi) * Math.sin(theta);
      return new THREE.Vector3(x, y, z);
    }

    window.searchCountries = searchCountries;
    window.onload = init;
  </script>
</body>
</html>
