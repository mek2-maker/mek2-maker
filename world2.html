<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>3D 지구본 - 국기 및 국가 정보 표시</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline';">
  <!-- turf.js 및 Papa Parse 로드 -->
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(255,255,255,0.9);
      padding: 10px;
      border-radius: 5px;
      font-family: sans-serif;
      width: 300px;
      max-width: 80vw;
      box-sizing: border-box;
    }
    #results {
      margin-top: 10px;
      max-height: 150px;
      overflow-y: auto;
    }
    .result-item {
      padding: 5px;
      border-bottom: 1px solid #ccc;
      cursor: pointer;
    }
    .result-item:hover { background-color: #eee; }
    #overlay input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 5px;
    }
    /* 정보 패널: 화면 하단 2분할 */
    #info-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 150px;
      display: flex;
      background: rgba(255,255,255,0.95);
      font-family: sans-serif;
      box-sizing: border-box;
    }
    #info-panel .info {
      flex: 1;
      padding: 10px;
      text-align: center;
      overflow-y: auto;
    }
    #info-panel .info img {
      max-width: 100px;
      display: block;
      margin: 0 auto 5px;
    }
  </style>
</head>
<body>
  <!-- 검색 UI -->
  <div id="overlay">
    <label for="iso-code">국가명 검색 (예: Korea, China):</label>
    <input type="text" id="iso-code" placeholder="국가명을 입력하세요">
    <button id="searchBtn">검색</button>
    <div id="results"></div>
  </div>
  <!-- 하단 정보 패널 -->
  <div id="info-panel">
    <div id="left-info" class="info"></div>
    <div id="right-info" class="info"></div>
  </div>

  <script type="module">
    import * as THREE from './libs/three.module.js';
    import { OrbitControls } from './libs/OrbitControls.js';
    import TWEEN from './libs/tween.esm.js';
    import earcut from './libs/earcut.js';

    // turf.js는 전역(window.turf)에서 로드됨
    const { rewind } = window.turf;

    let scene, camera, renderer, controls;
    const globeRadius = 1;
    let globeMesh;
    let countryGeoJSON = null;
    let countryInfoData = null; // CSV 데이터

    // 현재 화면에 표시된 국기/경계 Mesh
    let currentFlagMesh = null;
    let currentBoundaryLine = null;
    let koreaBoundaryLine = null;

    // -------------------------------
    // 헬퍼 함수들
    // -------------------------------
    function getISO2(feature) {
      const iso2 = feature.properties.ISO_A2;
      return iso2 ? iso2.trim() : null;
    }
    function getCountryName(feature) {
      return feature.properties.ADMIN;
    }
    function lonLatToXYZ(lon, lat, radius = globeRadius) {
      const phi = (90 - lat) * Math.PI / 180;
      const theta = (lon + 180) * Math.PI / 180;
      const x = -radius * Math.sin(phi) * Math.cos(theta);
      const z =  radius * Math.sin(phi) * Math.sin(theta);
      const y =  radius * Math.cos(phi);
      return new THREE.Vector3(x, y, z);
    }

    // 국기 텍스처 로드 (gif → png 순서)
    async function loadFlagTexture(iso2) {
      if (!iso2 || iso2 === "??") throw new Error("ISO2 코드 없음");
      const exts = ['gif','jpg','png'];
      const loader = new THREE.TextureLoader();
      for (const ext of exts) {
        const url = `./flag/${iso2}.${ext}`;
        try {
          const tex = await loader.loadAsync(url);
          console.log("Loaded flag texture:", url);
          return tex;
        } catch(e) {
          console.warn("국기 로드 실패:", url);
        }
      }
      throw new Error(`국기 파일 없음: ${iso2}`);
    }

    function removeOldFlagMesh() {
      if (currentFlagMesh) {
        scene.remove(currentFlagMesh);
        disposeObject(currentFlagMesh);
        currentFlagMesh = null;
      }
    }
    function disposeObject(obj) {
      obj.traverse(child => {
        if (child.isMesh) {
          child.geometry.dispose();
          if (child.material.map) child.material.map.dispose();
          child.material.dispose();
        }
      });
    }

    // polygonToSphereMesh (로컬 2D 변환 후 Earcut 삼각분할)
    function polygonToSphereMesh(coordsArray, { minLon, maxLon, minLat, maxLat, centerLon, centerLat }, radius = globeRadius + 0.02) {
      const outerRing = coordsArray[0];
      if (!outerRing || outerRing.length < 3) return null;
      const outer2D = toLocal2D(outerRing, centerLon, centerLat);
      const hole2DArray = [];
      for (let i = 1; i < coordsArray.length; i++) {
        if (coordsArray[i] && coordsArray[i].length >= 3) {
          hole2DArray.push(toLocal2D(coordsArray[i], centerLon, centerLat));
        }
      }
      const verts2D = [];
      const holeIndices = [];
      outer2D.forEach(p => verts2D.push(p[0], p[1]));
      let acc = outer2D.length;
      hole2DArray.forEach(h => {
        holeIndices.push(acc);
        h.forEach(p => verts2D.push(p[0], p[1]));
        acc += h.length;
      });
      const indices = earcut(verts2D, holeIndices, 2);
      const geometry = new THREE.BufferGeometry();
      const positions = [];
      const uvs = [];
      const degToRad = Math.PI / 180;
      for (let i = 0; i < indices.length; i++) {
        const idx = indices[i];
        const x2D = verts2D[idx * 2];
        const y2D = verts2D[idx * 2 + 1];
        const realLon = centerLon + (x2D / degToRad);
        const realLat = centerLat + (y2D / degToRad);
        const v3 = lonLatToXYZ(realLon, realLat, radius);
        positions.push(v3.x, v3.y, v3.z);
        const u = (realLon - minLon) / (maxLon - minLon);
        const v = (realLat - minLat) / (maxLat - minLat);
        uvs.push(u, v);
      }
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(positions), 3));
      geometry.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(uvs), 2));
      geometry.computeVertexNormals();
      return new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({
        color: 0xffffff,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.6
      }));
    }

    function toLocal2D(ring, cLon, cLat) {
      const degToRad = Math.PI / 180;
      return ring.map(([lon, lat]) => {
        const dx = (lon - cLon) * degToRad;
        const dy = (lat - cLat) * degToRad;
        return [dx, dy];
      });
    }

    // createFlagShape: 국기 모양 생성 (폴리곤 + 텍스처 적용)
    async function createFlagShape(feature, iso2) {
      console.log("createFlagShape 시작:", feature, iso2);
      const { centerLon, centerLat, centerPos } = getBoundsCenter(feature);
      const { minLon, maxLon, minLat, maxLat } = (() => {
        let minLon = 180, maxLon = -180, minLat = 90, maxLat = -90;
        feature.geometry.coordinates.flat(2).forEach(([lon, lat]) => {
          minLon = Math.min(minLon, lon);
          maxLon = Math.max(maxLon, lon);
          minLat = Math.min(minLat, lat);
          maxLat = Math.max(maxLat, lat);
        });
        return { minLon, maxLon, minLat, maxLat };
      })();
      const meshGroup = new THREE.Group();
      const geom = feature.geometry;
      if (geom.type === 'Polygon') {
        const mesh = polygonToSphereMesh(geom.coordinates, { minLon, maxLon, minLat, maxLat, centerLon, centerLat });
        if (mesh) meshGroup.add(mesh);
      } else if (geom.type === 'MultiPolygon') {
        geom.coordinates.forEach(polyCoords => {
          const mesh = polygonToSphereMesh(polyCoords, { minLon, maxLon, minLat, maxLat, centerLon, centerLat });
          if (mesh) meshGroup.add(mesh);
        });
      }
      const flagTex = await loadFlagTexture(iso2);
      meshGroup.traverse(obj => {
        if (obj.isMesh) {
          obj.material.map = flagTex;
          obj.material.needsUpdate = true;
        }
      });
      const normal = centerPos.clone().normalize();
      let tangent = new THREE.Vector3(-normal.y, normal.x, 0);
      if (tangent.length() < 0.0001) {
        tangent = new THREE.Vector3(0, -normal.z, normal.y);
      }
      tangent.normalize();
      const bitangent = new THREE.Vector3().crossVectors(normal, tangent).normalize();
      const basis = new THREE.Matrix4();
      basis.makeBasis(tangent, bitangent, normal);
      meshGroup.setRotationFromMatrix(basis);
      console.log("createFlagShape 최종 meshGroup:", meshGroup);
      return meshGroup;
    }

    // getBoundsCenter: bbox 중심(산술 평균) 계산
    function getBoundsCenter(feature) {
      let minLon = 180, maxLon = -180, minLat = 90, maxLat = -90;
      const geom = feature.geometry;
      if (geom.type === 'Polygon') {
        geom.coordinates.forEach(ring => {
          ring.forEach(([lon, lat]) => {
            if (lon < minLon) minLon = lon;
            if (lon > maxLon) maxLon = lon;
            if (lat < minLat) minLat = lat;
            if (lat > maxLat) maxLat = lat;
          });
        });
      } else if (geom.type === 'MultiPolygon') {
        geom.coordinates.forEach(poly => {
          poly.forEach(ring => {
            ring.forEach(([lon, lat]) => {
              if (lon < minLon) minLon = lon;
              if (lon > maxLon) maxLon = lon;
              if (lat < minLat) minLat = lat;
              if (lat > maxLat) maxLat = lat;
            });
          });
        });
      }
      const centerLon = (minLon + maxLon) / 2;
      const centerLat = (minLat + maxLat) / 2;
      const centerPos = lonLatToXYZ(centerLon, centerLat, globeRadius + 0.02);
      return { minLon, maxLon, minLat, maxLat, centerLon, centerLat, centerPos };
    }

    // CSV 파서 (Papa Parse 사용)
    function parseCSV(text) {
      return Papa.parse(text, { header:true, skipEmptyLines:true }).data;
    }

    // 정보 패널 업데이트 함수
    function updateLeftPanel() {
      const left = document.getElementById('left-info');
      if (!countryInfoData) return;
      const korea = countryInfoData.find(item => (item.Name||"").toLowerCase().includes("korea"));
      left.innerHTML = korea
        ? `<img src="./flag/${korea.ISO2}.jpg" alt="${korea.Name}"><strong>${korea.Name}</strong><br>수도: ${korea.Capital}<br>인구: ${korea.Population}<br>GDP: ${korea.GDP}`
        : "대한민국 정보 없음";
    }
    function updateRightPanel(name) {
      const right = document.getElementById('right-info');
      if (!countryInfoData) return;
      const info = countryInfoData.find(item => (item.Name||"").toLowerCase().includes(name.toLowerCase()));
      right.innerHTML = info
        ? `<img src="./flag/${info.ISO2}.jpg" alt="${info.Name}"><strong>${info.Name}</strong><br>수도: ${info.Capital}<br>인구: ${info.Population}<br>GDP: ${info.GDP}`
        : "국가 정보 없음";
    }

    // 초기화 및 애니메이션
    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
      camera.position.set(2,2,2);
      renderer = new THREE.WebGLRenderer({ antialias:true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);
      controls = new OrbitControls(camera, renderer.domElement);
      controls.update();

      const sphereGeo = new THREE.SphereGeometry(globeRadius,64,64);
      const globeTex = new THREE.TextureLoader().load('eo_base_2020_clean_geo_optimized.jpg');
      const sphereMat = new THREE.MeshBasicMaterial({ map: globeTex });
      globeMesh = new THREE.Mesh(sphereGeo, sphereMat);
      scene.add(globeMesh);

      // GeoJSON 로드
      fetch('countries.geojson')
        .then(res => res.json())
        .then(data => {
          countryGeoJSON = data;
          document.getElementById('iso-code').value = "south korea";
          searchCountries();
        })
        .catch(err => console.error("GeoJSON 로드 실패:", err));

      // CSV 로드
      fetch('country_info.csv')
        .then(res => res.text())
        .then(text => {
          countryInfoData = parseCSV(text);
          updateLeftPanel();
        })
        .catch(err => console.error("CSV 로드 실패:", err));

      animate();
    }
    function animate(time) {
      requestAnimationFrame(animate);
      TWEEN.update(time);
      controls.update();
      renderer.render(scene, camera);
    }

    // 국가 검색 및 표시
    function searchCountries() {
      const term = document.getElementById('iso-code').value.trim().toLowerCase();
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = "";
      if (!countryGeoJSON) { alert("GeoJSON 데이터 로드 중..."); return; }
      const matches = countryGeoJSON.features.filter(f => f.properties.ADMIN.toLowerCase().includes(term));
      if (matches.length === 0) { resultsDiv.innerHTML = "<div>검색 결과 없음</div>"; return; }
      if (matches.length === 1) {
        document.getElementById('iso-code').value = matches[0].properties.ADMIN;
        displayCountry(matches[0]);
        resultsDiv.innerHTML = "";
      } else {
        matches.forEach(f => {
          const div = document.createElement('div');
          div.className = "result-item";
          const iso = getISO2(f) || "??";
          div.textContent = `${f.properties.ADMIN} (${iso})`;
          div.addEventListener('click', () => {
            displayCountry(f);
            resultsDiv.innerHTML = "";
            document.getElementById('iso-code').value = f.properties.ADMIN;
          });
          resultsDiv.appendChild(div);
        });
      }
    }

    function displayCountry(feature) {
      drawCountryBoundary(feature);
      const iso = getISO2(feature) || "??";
      createFlagShape(feature, iso)
        .then(mesh => {
          removeOldFlagMesh();
          currentFlagMesh = mesh;
          scene.add(currentFlagMesh);
          console.log("국기 Shape 생성 완료");
        })
        .catch(err => console.warn("국기 Shape 생성 실패:", err));
      updateRightPanel(feature.properties.ADMIN);
      const { centerPos } = getBoundsCenter(feature);
      new TWEEN.Tween(camera.position)
        .to({ x: centerPos.x * 2.2, y: centerPos.y * 2.2, z: centerPos.z * 2.2 }, 1000)
        .easing(TWEEN.Easing.Quadratic.Out)
        .onComplete(() => { controls.target.set(0,0,0); controls.update(); })
        .start();
    }

    // 경계선 표시 (South Korea는 항상 유지)
    function drawCountryBoundary(feature) {
      const isoA3 = feature.properties.ISO_A3;
      const color = (isoA3 === "KOR") ? 0x0000ff : 0xff0000;
      if (isoA3 !== "KOR" && currentBoundaryLine) {
        scene.remove(currentBoundaryLine);
        disposeObject(currentBoundaryLine);
        currentBoundaryLine = null;
      }
      if (isoA3 === "KOR") {
        if (!koreaBoundaryLine) {
          koreaBoundaryLine = createBoundaryLineGroup(feature);
          scene.add(koreaBoundaryLine);
        }
        return;
      }
      currentBoundaryLine = createBoundaryLineGroup(feature);
      scene.add(currentBoundaryLine);
    }
    function createBoundaryLineGroup(feature) {
      const group = new THREE.Group();
      const geom = feature.geometry;
      if (!geom) return group;
      const color = 0xff0000;
      if (geom.type === "Polygon") {
        geom.coordinates.forEach(ring => {
          const line = createBoundaryLineMesh(ring, color);
          if (line) group.add(line);
        });
      } else if (geom.type === "MultiPolygon") {
        geom.coordinates.forEach(poly => {
          poly.forEach(ring => {
            const line = createBoundaryLineMesh(ring, color);
            if (line) group.add(line);
          });
        });
      }
      return group;
    }
    function createBoundaryLineMesh(ring, color) {
      if (!ring || ring.length < 2) return null;
      if (!ring[0].every((val, idx) => val === ring[ring.length - 1][idx])) {
        ring.push(ring[0]);
      }
      const pts = ring.map(([lon, lat]) => lonLatToXYZ(lon, lat, globeRadius + 0.02));
      const geo = new THREE.BufferGeometry().setFromPoints(pts);
      const mat = new THREE.LineBasicMaterial({ color });
      return new THREE.Line(geo, mat);
    }

    window.onload = init;
    document.getElementById('searchBtn').addEventListener('click', searchCountries);
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
