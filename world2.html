<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>3D 지구본 - 전체 국기를 마스크로 표현</title>
  <!-- CSP 등 필요시 설정 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline';">
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(255,255,255,0.9);
      padding: 10px;
      border-radius: 5px;
      font-family: sans-serif;
      width: 300px;
      max-width: 80vw;
      box-sizing: border-box;
    }
    #results {
      margin-top: 10px;
      max-height: 150px;
      overflow-y: auto;
    }
    .result-item {
      padding: 5px;
      border-bottom: 1px solid #ccc;
      cursor: pointer;
    }
    .result-item:hover { background-color: #eee; }
    #overlay input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 5px;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <label for="iso-code">국가명 검색 (예: Korea, China):</label>
    <input type="text" id="iso-code" placeholder="국가명을 입력하세요">
    <button id="searchBtn">검색</button>
    <div id="results"></div>
  </div>

  <script type="module">
    import * as THREE from './libs/three.module.js';
    import { OrbitControls } from './libs/OrbitControls.js';
    import TWEEN from './libs/tween.esm.js';
    import earcut from './libs/earcut.js';
    import { BufferGeometryUtils } from './libs/BufferGeometryUtils.js';

    let scene, camera, renderer, controls;
    const globeRadius = 1;
    let globeMesh;
    let countryGeoJSON = null;

    // 현재 화면에 표시된 국기/경계 Mesh
    let currentFlagMesh = null;
    let currentBoundaryLine = null;
    let koreaBoundaryLine = null;

    // --- 헬퍼 함수들 ---
    function getISO2(feature) {
      const iso2 = feature.properties.ISO_A2;
      return iso2 ? iso2.trim() : null;
    }
    function getCountryName(feature) {
      return feature.properties.ADMIN;
    }
    // (lon, lat)를 구의 표면상의 3D 월드 좌표로 변환 (구면 좌표)
    function lonLatToXYZ(lon, lat, radius = globeRadius) {
      const phi = (90 - lat) * (Math.PI / 180);
      const theta = (lon + 180) * (Math.PI / 180);
      const x = -radius * Math.sin(phi) * Math.cos(theta);
      const z =  radius * Math.sin(phi) * Math.sin(theta);
      const y =  radius * Math.cos(phi);
      return new THREE.Vector3(x, y, z);
    }

    // 국기 텍스처 로드 (여러 확장자를 시도)
    function loadFlagTexture(iso2) {
      return new Promise((resolve, reject) => {
        if (iso2 === "??") {
          return reject("ISO2 코드가 없어 국기 이미지를 찾을 수 없음");
        }
        const exts = ['gif', 'png', 'jpg', 'bmp'];
        const basePath = './flag/';
        const loader = new THREE.TextureLoader();
        function tryLoad(i) {
          if (i >= exts.length) {
            reject(`모든 확장자를 시도했으나 '${iso2}' 국기 파일 없음`);
            return;
          }
          const url = `${basePath}${iso2}.${exts[i]}`;
          console.log("Trying to load:", url);
          loader.load(
            url,
            texture => {
              console.log("Loaded flag texture:", url);
              resolve(texture);
            },
            undefined,
            () => {
              console.warn("Failed to load:", url);
              tryLoad(i + 1);
            }
          );
        }
        tryLoad(0);
      });
    }

    // 기존 국기 Mesh 제거
    function removeOldFlagMesh() {
      if (currentFlagMesh) {
        scene.remove(currentFlagMesh);
        disposeObject(currentFlagMesh);
        currentFlagMesh = null;
      }
    }
    function disposeObject(obj) {
      obj.traverse(child => {
        if (child.isMesh) {
          child.geometry.dispose();
          if (child.material.map) child.material.map.dispose();
          child.material.dispose();
        }
      });
    }

    // --- (1) 국가 폴리곤(경계) 기반 Geometry 생성 ---
    // GeoJSON 좌표(경도, 위도)를 earcut으로 삼각분할한 후
    // 각 정점에 bbox 기준 UV를 할당합니다.
    function polygonToSphereMesh(coordsArray, minLon, maxLon, minLat, maxLat, radius = globeRadius + 0.02) {
      const outerRing = coordsArray[0];
      if (!outerRing || outerRing.length < 3) return null;

      // 2D 좌표(경도, 위도) 배열 생성 (earcut용)
      const outer2D = outerRing.map(([lon, lat]) => [lon, lat]);
      const hole2DArray = [];
      for (let i = 1; i < coordsArray.length; i++) {
        if (coordsArray[i] && coordsArray[i].length >= 3) {
          hole2DArray.push(coordsArray[i].map(([lon, lat]) => [lon, lat]));
        }
      }
      const verts2D = [];
      const holeIndices = [];
      outer2D.forEach(p => verts2D.push(p[0], p[1]));
      let acc = outer2D.length;
      hole2DArray.forEach(h => {
        holeIndices.push(acc);
        h.forEach(p => verts2D.push(p[0], p[1]));
        acc += h.length;
      });

      const indices = earcut(verts2D, holeIndices, 2);

      const geometry = new THREE.BufferGeometry();
      const positions = [];
      const uvs = [];
      const lonRange = maxLon - minLon || 1;
      const latRange = maxLat - minLat || 1;

      for (let i = 0; i < indices.length; i++) {
        const idx = indices[i];
        const lon = verts2D[idx * 2];
        const lat = verts2D[idx * 2 + 1];
        const pos = lonLatToXYZ(lon, lat, radius);
        positions.push(pos.x, pos.y, pos.z);
        // UV는 bbox 기준으로 0~1 매핑
        const u = (lon - minLon) / lonRange;
        const v = (lat - minLat) / latRange;
        uvs.push(u, v);
      }

      geometry.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(positions), 3));
      geometry.setAttribute('uv', new THREE.Float32BufferAttribute(new Float32Array(uvs), 2));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();
      return geometry;
    }

    // --- (2) 국기 셰이더 Material ---
    // 이 셰이더는 폴리곤의 UV를 이용해 전체 국기 이미지를 letterbox 방식으로 보여줍니다.
    function createFlagShaderMaterial(flagTexture, bboxAspect, flagAspect = 1.5) {
      const material = new THREE.ShaderMaterial({
        uniforms: {
          u_flagTexture: { value: flagTexture },
          u_bboxAspect: { value: bboxAspect },
          u_flagAspect: { value: flagAspect }
        },
        vertexShader: `
          varying vec2 vUv;
          void main(){
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          precision mediump float;
          uniform sampler2D u_flagTexture;
          uniform float u_bboxAspect;
          uniform float u_flagAspect;
          varying vec2 vUv;
          void main(){
            // vUv는 bbox 기준 [0,1]
            vec2 centeredUV = vUv - vec2(0.5);
            vec2 adjustedUV = centeredUV;
            if(u_bboxAspect > u_flagAspect){
              float scale = u_flagAspect / u_bboxAspect;
              adjustedUV.x *= scale;
            } else {
              float scale = u_bboxAspect / u_flagAspect;
              adjustedUV.y *= scale;
            }
            vec2 finalUV = adjustedUV + vec2(0.5);
            if(finalUV.x < 0.0 || finalUV.x > 1.0 || finalUV.y < 0.0 || finalUV.y > 1.0){
              discard;
            }
            gl_FragColor = texture2D(u_flagTexture, finalUV);
          }
        `,
        transparent: true,
      });
      return material;
    }

    // --- (3) 국기 Shape 생성 ---
    // GeoJSON 좌표로 폴리곤 Geometry를 만들고,
    // 위의 셰이더 Material을 적용하여 국기 Mesh를 생성합니다.
    async function createFlagShape(feature, iso2) {
      const geom = feature.geometry;
      let minLon = 180, maxLon = -180, minLat = 90, maxLat = -90;
      if (geom.type === 'Polygon') {
        geom.coordinates.forEach(ring => {
          ring.forEach(([lon, lat]) => {
            minLon = Math.min(minLon, lon);
            maxLon = Math.max(maxLon, lon);
            minLat = Math.min(minLat, lat);
            maxLat = Math.max(maxLat, lat);
          });
        });
      } else if (geom.type === 'MultiPolygon') {
        geom.coordinates.forEach(poly => {
          poly.forEach(ring => {
            ring.forEach(([lon, lat]) => {
              minLon = Math.min(minLon, lon);
              maxLon = Math.max(maxLon, lon);
              minLat = Math.min(minLat, lat);
              maxLat = Math.max(maxLat, lat);
            });
          });
        });
      }
      const bboxAspect = (maxLon - minLon) / (maxLat - minLat);
      let geometry;
      if (geom.type === 'Polygon') {
        geometry = polygonToSphereMesh(geom.coordinates, minLon, maxLon, minLat, maxLat, globeRadius + 0.02);
      } else if (geom.type === 'MultiPolygon') {
        const geometries = [];
        geom.coordinates.forEach(poly => {
          const geo = polygonToSphereMesh(poly, minLon, maxLon, minLat, maxLat, globeRadius + 0.02);
          if (geo) geometries.push(geo);
        });
        geometry = BufferGeometryUtils.mergeBufferGeometries(geometries);
      }
      const flagTex = await loadFlagTexture(iso2);
      const flagMaterial = createFlagShaderMaterial(flagTex, bboxAspect, 1.5);
      const flagMesh = new THREE.Mesh(geometry, flagMaterial);
      return flagMesh;
    }

    // --- (4) 카메라 이동을 위한 bbox 중심 계산 ---
    function getBoundsCenter(feature) {
      let minLon = 180, maxLon = -180, minLat = 90, maxLat = -90;
      const geom = feature.geometry;
      if (geom.type === 'Polygon') {
        geom.coordinates.forEach(ring => {
          ring.forEach(([lon, lat]) => {
            if (lon < minLon) minLon = lon;
            if (lon > maxLon) maxLon = lon;
            if (lat < minLat) minLat = lat;
            if (lat > maxLat) maxLat = lat;
          });
        });
      } else if (geom.type === 'MultiPolygon') {
        geom.coordinates.forEach(poly => {
          poly.forEach(ring => {
            ring.forEach(([lon, lat]) => {
              if (lon < minLon) minLon = lon;
              if (lon > maxLon) maxLon = lon;
              if (lat < minLat) minLat = lat;
              if (lat > maxLat) maxLat = lat;
            });
          });
        });
      }
      const centerLon = (minLon + maxLon) / 2;
      const centerLat = (minLat + maxLat) / 2;
      const centerPos = lonLatToXYZ(centerLon, centerLat, globeRadius + 0.02);
      return { minLon, maxLon, minLat, maxLat, centerLon, centerLat, centerPos };
    }

    // --- (5) 초기화 및 애니메이션 ---
    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(2, 2, 2);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.rotateSpeed = 0.3;
      controls.zoomSpeed = 1.2;
      controls.panSpeed = 1.0;
      controls.update();

      // 지구본 생성
      const sphereGeometry = new THREE.SphereGeometry(globeRadius, 64, 64);
      const textureLoader = new THREE.TextureLoader();
      const globeTexture = textureLoader.load('eo_base_2020_clean_geo_optimized.jpg');
      const sphereMaterial = new THREE.MeshBasicMaterial({ map: globeTexture });
      globeMesh = new THREE.Mesh(sphereGeometry, sphereMaterial);
      scene.add(globeMesh);

      // 국가 GeoJSON 로드
      fetch('countries.geojson')
        .then(response => response.json())
        .then(data => {
          countryGeoJSON = data;
          document.getElementById('iso-code').value = "south korea";
          searchCountries(); // 초기 로딩 시 한국 표시
        })
        .catch(err => console.error('GeoJSON 로드 실패:', err));

      animate();
    }

    function animate(time) {
      requestAnimationFrame(animate);
      TWEEN.update(time);
      controls.update();
      renderer.render(scene, camera);
    }

    // --- (6) 국가 검색 및 표시 ---
    function searchCountries() {
      const searchTerm = document.getElementById('iso-code').value.trim().toLowerCase();
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = "";
      if (!countryGeoJSON) {
        alert("GeoJSON 데이터가 아직 로드되지 않았습니다.");
        return;
      }
      const matches = countryGeoJSON.features.filter(feature =>
        getCountryName(feature).toLowerCase().includes(searchTerm)
      );
      if (matches.length === 0) {
        resultsDiv.innerHTML = "<div>검색 결과가 없습니다.</div>";
        return;
      }
      if (matches.length === 1) {
        document.getElementById('iso-code').value = getCountryName(matches[0]);
        displayCountry(matches[0]);
        resultsDiv.innerHTML = "";
      } else {
        matches.forEach(feature => {
          const div = document.createElement('div');
          div.className = "result-item";
          const iso2 = getISO2(feature) || "??";
          div.textContent = `${getCountryName(feature)} (${iso2})`;
          div.addEventListener('click', () => {
            displayCountry(feature);
            resultsDiv.innerHTML = "";
            document.getElementById('iso-code').value = getCountryName(feature);
          });
          resultsDiv.appendChild(div);
        });
      }
    }

    function displayCountry(feature) {
      drawCountryBoundary(feature);
      const iso2 = getISO2(feature) || "??";
      createFlagShape(feature, iso2)
        .then(flagMesh => {
          removeOldFlagMesh();
          currentFlagMesh = flagMesh;
          scene.add(currentFlagMesh);
          // 디버그용 BoxHelper (원하면 주석 처리)
          const boxHelper = new THREE.BoxHelper(currentFlagMesh, 0xff00ff);
          scene.add(boxHelper);
        })
        .catch(err => console.warn("국기 Shape 생성 실패:", err));
      // 카메라 이동 (bbox 중심 사용)
      const { centerPos } = getBoundsCenter(feature);
      new TWEEN.Tween(camera.position)
        .to({ x: centerPos.x * 2.2, y: centerPos.y * 2.2, z: centerPos.z * 2.2 }, 1000)
        .easing(TWEEN.Easing.Quadratic.Out)
        .onComplete(() => {
          controls.target.copy(centerPos);
          controls.update();
        })
        .start();
    }

    // --- (7) 경계선(Line) 표시 (South Korea는 항상 유지) ---
    function drawCountryBoundary(feature) {
      const isoA3 = feature.properties.ISO_A3;
      const lineColor = (isoA3 === "KOR") ? 0x0000ff : 0xff0000;
      if (isoA3 !== "KOR" && currentBoundaryLine) {
        scene.remove(currentBoundaryLine);
        disposeObject(currentBoundaryLine);
        currentBoundaryLine = null;
      }
      if (isoA3 === "KOR") {
        if (!koreaBoundaryLine) {
          koreaBoundaryLine = createBoundaryLineGroup(feature, 0x0000ff);
          scene.add(koreaBoundaryLine);
        }
        return;
      }
      currentBoundaryLine = createBoundaryLineGroup(feature, lineColor);
      scene.add(currentBoundaryLine);
    }

    function createBoundaryLineGroup(feature, color = 0xff0000) {
      const lineGroup = new THREE.Group();
      const geom = feature.geometry;
      if (!geom) return lineGroup;
      if (geom.type === 'Polygon') {
        geom.coordinates.forEach(ring => {
          const lineMesh = createBoundaryLineMesh(ring, color);
          if (lineMesh) lineGroup.add(lineMesh);
        });
      } else if (geom.type === 'MultiPolygon') {
        geom.coordinates.forEach(poly => {
          poly.forEach(ring => {
            const lineMesh = createBoundaryLineMesh(ring, color);
            if (lineMesh) lineGroup.add(lineMesh);
          });
        });
      }
      return lineGroup;
    }

    function createBoundaryLineMesh(ring, color) {
      if (!ring || ring.length < 2) return null;
      const ringCopy = ring.slice();
      if (!ringCopy[0].every((val, idx) => val === ringCopy[ringCopy.length - 1][idx])) {
        ringCopy.push(ringCopy[0]);
      }
      const points = ringCopy.map(([lon, lat]) => lonLatToXYZ(lon, lat, globeRadius + 0.02));
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const material = new THREE.LineBasicMaterial({ color });
      return new THREE.Line(geometry, material);
    }

    // 이벤트 설정
    window.onload = init;
    document.getElementById('searchBtn').addEventListener('click', searchCountries);
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
