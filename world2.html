<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>3D 지구본 (경계선 내부 국기 표시, South Korea 경계 유지)</title>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(255,255,255,0.9);
      padding: 10px;
      border-radius: 5px;
      font-family: sans-serif;
      width: 300px;
      max-width: 80vw;
    }
    #results { margin-top: 10px; max-height: 150px; overflow-y: auto; }
    .result-item { padding: 5px; border-bottom: 1px solid #ccc; cursor: pointer; }
    .result-item:hover { background-color: #eee; }
    #overlay input { width: 100%; margin-bottom: 5px; }
  </style>
</head>
<body>
  <div id="overlay">
    <label>국가명 검색 (예: Korea, China):</label>
    <input type="text" id="iso-code" placeholder="국가명을 입력하세요">
    <button id="searchBtn">검색</button>
    <div id="results"></div>
  </div>

  <script type="module">
    import * as THREE from './libs/three.module.js';
    import { OrbitControls } from './libs/OrbitControls.js';
    import TWEEN from './libs/tween.esm.js';

    let scene, camera, renderer, controls;
    const globeRadius = 1;
    let globeMesh, countryGeoJSON = null;
    let currentFlagMesh = null, currentBoundaryLine = null, koreaBoundaryLine = null;

    function getISO2(feature) {
      return feature.properties.ISO_A2?.trim() || null;
    }
    function getCountryName(feature) {
      return feature.properties.ADMIN;
    }
    function lonLatToXYZ(lon, lat, radius = globeRadius) {
      const phi = (90 - lat) * (Math.PI / 180);
      const theta = (lon + 180) * (Math.PI / 180);
      return new THREE.Vector3(
        -radius * Math.sin(phi) * Math.cos(theta),
        radius * Math.cos(phi),
        radius * Math.sin(phi) * Math.sin(theta)
      );
    }

    function loadFlagTexture(iso2) {
      return new Promise((resolve, reject) => {
        const exts = ['png', 'jpg', 'gif'];
        const basePath = './flag/';
        const loader = new THREE.TextureLoader();
        function tryLoad(i) {
          if (i >= exts.length) return reject(`국기 이미지 없음: ${iso2}`);
          const url = `${basePath}${iso2}.${exts[i]}`;
          loader.load(url, resolve, undefined, () => tryLoad(i + 1));
        }
        tryLoad(0);
      });
    }

    function removeOldFlagMesh() {
      if (currentFlagMesh) {
        scene.remove(currentFlagMesh);
        disposeObject(currentFlagMesh);
        currentFlagMesh = null;
      }
    }

    function disposeObject(obj) {
      obj.traverse(child => {
        if (child.isMesh) {
          child.geometry.dispose();
          if (child.material.map) child.material.map.dispose();
          child.material.dispose();
        }
      });
    }

    function getBoundsCenter(feature) {
      let minLon = 180, maxLon = -180, minLat = 90, maxLat = -90;
      feature.geometry.coordinates.flat(2).forEach(([lon, lat]) => {
        minLon = Math.min(minLon, lon);
        maxLon = Math.max(maxLon, lon);
        minLat = Math.min(minLat, lat);
        maxLat = Math.max(maxLat, lat);
      });
      return lonLatToXYZ((minLon + maxLon) / 2, (minLat + maxLat) / 2, globeRadius + 0.02);
    }

    async function fillCountryWithFlag(feature, iso2) {
      if (!feature.geometry) return;

      removeOldFlagMesh();
      try {
        const flagTexture = await loadFlagTexture(iso2);
        flagTexture.wrapS = THREE.RepeatWrapping;
        flagTexture.wrapT = THREE.RepeatWrapping;

        const shape = new THREE.Shape();
        feature.geometry.coordinates[0].forEach(([lon, lat], i) => {
          const point = lonLatToXYZ(lon, lat);
          i === 0 ? shape.moveTo(point.x, point.y) : shape.lineTo(point.x, point.y);
        });

        const geometry = new THREE.ShapeGeometry(shape);
        const material = new THREE.MeshBasicMaterial({
          map: flagTexture, side: THREE.DoubleSide, transparent: true, opacity: 0.9
        });
        const countryMesh = new THREE.Mesh(geometry, material);
        countryMesh.position.copy(getBoundsCenter(feature));

        scene.add(countryMesh);
        currentFlagMesh = countryMesh;
      } catch (error) {
        console.warn("국기 텍스처 로드 실패:", error);
      }
    }

    function drawCountryBoundary(feature) {
      if (currentBoundaryLine) {
        scene.remove(currentBoundaryLine);
        disposeObject(currentBoundaryLine);
        currentBoundaryLine = null;
      }

      const geometry = new THREE.BufferGeometry();
      const points = feature.geometry.coordinates[0].map(([lon, lat]) => lonLatToXYZ(lon, lat, globeRadius + 0.01));
      geometry.setFromPoints(points);
      const material = new THREE.LineBasicMaterial({ color: 0xff0000 });
      currentBoundaryLine = new THREE.LineLoop(geometry, material);
      scene.add(currentBoundaryLine);
    }

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(2, 2, 2);
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);
      controls = new OrbitControls(camera, renderer.domElement);
      controls.update();

      const textureLoader = new THREE.TextureLoader();
      globeMesh = new THREE.Mesh(
        new THREE.SphereGeometry(globeRadius, 64, 64),
        new THREE.MeshBasicMaterial({ map: textureLoader.load('eo_base_2020_clean_geo_optimized.jpg') })
      );
      scene.add(globeMesh);

      fetch('countries.geojson')
        .then(response => response.json())
        .then(data => { countryGeoJSON = data; searchCountries(); })
        .catch(console.error);

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      TWEEN.update();
      controls.update();
      renderer.render(scene, camera);
    }

    function searchCountries() {
      const searchTerm = document.getElementById('iso-code').value.trim().toLowerCase();
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = "";
      if (!countryGeoJSON) return alert("GeoJSON 데이터가 로드되지 않음.");

      const matches = countryGeoJSON.features.filter(f => getCountryName(f).toLowerCase().includes(searchTerm));
      if (matches.length === 1) return displayCountry(matches[0]);

      matches.forEach(feature => {
        const div = document.createElement('div');
        div.className = "result-item";
        div.textContent = `${getCountryName(feature)} (${getISO2(feature) || "??"})`;
        div.onclick = () => displayCountry(feature);
        resultsDiv.appendChild(div);
      });
    }

    function displayCountry(feature) {
      drawCountryBoundary(feature);
      fillCountryWithFlag(feature, getISO2(feature) || "??");

      const centerPos = getBoundsCenter(feature);
      new TWEEN.Tween(camera.position)
        .to({ x: centerPos.x * 2, y: centerPos.y * 2, z: centerPos.z * 2 }, 1000)
        .easing(TWEEN.Easing.Quadratic.Out)
        .start();
      controls.target.set(0, 0, 0);
      controls.update();
    }

    window.onload = init;
    document.getElementById('searchBtn').addEventListener('click', searchCountries);
  </script>
</body>
</html>
