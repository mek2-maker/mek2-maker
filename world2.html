<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>3D 지구본 — 국기 아이콘 표시</title>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
<style>
  body { margin:0; overflow:hidden }
  #overlay { position:absolute; top:10px; left:10px; background:#fffcc; padding:10px; }
</style>
</head>
<body>
<div id="overlay">
  <input id="iso-code" placeholder="국가명 입력">
  <button onclick="searchCountries()">검색</button>
</div>
<script type="module">
import * as THREE from './libs/three.module.js';
import { OrbitControls } from './libs/OrbitControls.js';
import earcut from './libs/earcut.js';
import TWEEN from './libs/tween.esm.js';

let scene, camera, renderer, controls, geojson;
const R=1;

async function init(){
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,0.1,100);
  camera.position.set(2,2,2);
  renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight);
  document.body.appendChild(renderer.domElement);
  controls=new OrbitControls(camera,renderer.domElement);

  // 지구본
  const globe=new THREE.Mesh(
    new THREE.SphereGeometry(R,64,64),
    new THREE.MeshBasicMaterial({map:new THREE.TextureLoader().load('eo_base_2020_clean_geo_optimized.jpg')})
  );
  scene.add(globe);

  geojson=await (await fetch('countries.geojson')).json();
  animate();
}

function animate(t){
  requestAnimationFrame(animate);
  TWEEN.update(t);
  controls.update();
  renderer.render(scene,camera);
}

async function searchCountries(){
  const name=document.getElementById('iso-code').value.trim().toLowerCase();
  const match=geojson.features.find(f=>f.properties.ADMIN.toLowerCase().includes(name));
  if(!match) return alert('검색 결과 없음');
  displayFlag(match);
}

async function displayFlag(feature){
  // 기존 Sprite 제거
  scene.children.filter(o=>o.isSprite).forEach(o=>scene.remove(o));

  const centroid=turf.centroid(feature).geometry.coordinates;
  const [lon,lat]=centroid;
  const pos=lonLatToXYZ(lon,lat,R+0.01);

  // 텍스처 로드
  const iso2=(feature.properties.ISO_A2||'').trim()||'??';
  const url=`./flag/${iso2}.jpg`;
  const tex=await new Promise((res,rej)=>{
    new THREE.TextureLoader().load(url,res,undefined,()=>rej());
  }).catch(_=>null);

  if(!tex) return alert('국기 로드 실패');

  const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));
  sprite.position.copy(pos);
  sprite.scale.set(0.2,0.2,0.2);
  scene.add(sprite);

  // 카메라 이동
  new TWEEN.Tween(camera.position)
    .to({ x: pos.x*2.2, y: pos.y*2.2, z: pos.z*2.2 }, 1000)
    .easing(TWEEN.Easing.Quadratic.Out)
    .onComplete(()=>{ controls.target.copy(pos); controls.update(); })
    .start();
}

function lonLatToXYZ(lon,lat,radius=R){
  const phi=(90-lat)*Math.PI/180;
  const theta=(lon+180)*Math.PI/180;
  return new THREE.Vector3(
    -radius*Math.sin(phi)*Math.cos(theta),
    radius*Math.cos(phi),
    radius*Math.sin(phi)*Math.sin(theta)
  );
}

window.onload=init;
</script>
</body>
</html>
