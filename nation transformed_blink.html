<div class="blink-marker" style="--width: 300px; --height: 30px; --color: #ff4d4d;"></div>

<style>
/* 페이지 기본 여백 제거 */
html, body { margin:0; padding:0; }

/* 전체 투명 캔버스 */
.blink-marker{
  position: fixed; inset: 0; pointer-events: none;
  --pad-x: calc(var(--width) * 0.7);
  --pad-y: calc(var(--height) * 0.7);
}

/* 두 직사각형 중심 같게 */
.blink-marker::before, .blink-marker::after{
  content:""; position:absolute;
  left: var(--pad-x); top: var(--pad-y);
  transform: translate(-50%, -50%);
  pointer-events:none;
}

/* 고정된 직사각형 */
.blink-marker::before{
  width: var(--width); height: var(--height);
  border: 2px solid var(--color);
  background: transparent;
}

/* 퍼지면서 깜빡이는 직사각형 */
.blink-marker::after{
  width: calc(var(--width) * 1.4);
  height: calc(var(--height) * 1.4);
  border: 2px solid var(--color);
  animation: pulse 1.2s ease-out infinite;
  opacity: .9;
}

@keyframes pulse{
  0%{ transform: translate(-50%, -50%) scale(0.7); opacity: .9; }
  70%{ transform: translate(-50%, -50%) scale(1.3); opacity: 0; }
  100%{ transform: translate(-50%, -50%) scale(1.3); opacity: 0; }
}
</style>
