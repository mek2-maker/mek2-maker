<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>3D 지구본 – 국가별 실시간 시계</title>
  <style>
    body { margin:0; overflow:hidden; }
    #overlay {
      position:absolute; top:10px; left:10px;
      background:rgba(255,255,255,0.9);
      padding:8px; border-radius:4px;
      font-family:sans-serif; z-index:10;
      display:flex; gap:10px; align-items:center;
    }
    #overlay input { width:140px; padding:4px; border:1px solid #ccc; border-radius:3px; }
    #overlay button { padding:4px 8px; border:1px solid #007bff; background-color:#007bff; color:#fff; border-radius:3px; cursor:pointer; }
    #overlay button:hover { background-color:#0056b3; }
    #message { margin-left:10px; color:red; font-size:0.9em; }
    #info-panel { position:absolute; bottom:0; left:0; width:100%; height:240px; display:flex; background:rgba(255,255,255,0.95); font-family:sans-serif; }
    .info { flex:1; padding:10px; text-align:center; position:relative; }
    .info img { max-height:60px; margin-bottom:6px; }
    .time-label { position:absolute; top:10px; width:100%; font-size:0.9em; color:#333; }
    .info-content { margin-top:24px; }
  </style>
</head>
<body>
  <div id="overlay">
    <input id="iso-code" placeholder="국가 이름 입력" list="country-names">
    <button id="searchBtn">검색</button>
    <div id="message"></div>
  </div>
  <div id="info-panel">
    <div id="left-info" class="info">
      <div id="time-kr" class="time-label"></div>
      <div class="info-content" id="left-content"></div>
    </div>
    <div id="right-info" class="info">
      <div id="time-selected" class="time-label"></div>
      <div class="info-content" id="right-content"></div>
    </div>
  </div>
  <script type="module">
    import * as THREE        from './libs/three.module.js';
    import { OrbitControls } from './libs/OrbitControls.js';
    import earcut            from './libs/earcut.js';
    import TWEEN             from './libs/tween.esm.js';
    import Papa              from 'https://cdn.jsdelivr.net/npm/papaparse@5.3.2/+esm';

    const R      = 1;
    const FILL_R = R + 0.0001;
    const LINE_R = R + 0.0002;
    let scene, camera, renderer, controls;
    let geoJSON, infoData, curLine, curFill;

    // 타임존 매핑
    const timeZoneMap = {
      kr: 'Asia/Seoul', de: 'Europe/Berlin', fr: 'Europe/Paris', us: 'America/New_York', cn: 'Asia/Shanghai', jp: 'Asia/Tokyo',
      mx: 'America/Mexico_City', ar: 'America/Argentina/Buenos_Aires', br: 'America/Sao_Paulo', cl: 'America/Santiago', co: 'America/Bogota',
      pe: 'America/Lima', ve: 'America/Caracas', ec: 'America/Guayaquil', bo: 'America/La_Paz', cu: 'America/Havana', do: 'America/Santo_Domingo',
      uy: 'America/Montevideo', py: 'America/Asuncion', pa: 'America/Panama', cr: 'America/Costa_Rica', gt: 'America/Guatemala', hn: 'America/Tegucigalpa',
      sv: 'America/El_Salvador', ni: 'America/Managua', bz: 'America/Belize', gy: 'America/Guyana', sr: 'America/Paramaribo',
      ht: 'America/Port-au-Prince', jm: 'America/Jamaica', tt: 'America/Port_of_Spain', pr: 'America/Puerto_Rico'
    };

    function showMessage(msg, type='error'){
      const msgDiv = document.getElementById('message');
      msgDiv.textContent = msg;
      msgDiv.style.color = (type==='error' ? 'red' : 'green');
      setTimeout(()=>msgDiv.textContent='', 3000);
    }

    function lonLatToXYZ(lon, lat, r=R){
      const φ = (90 - lat)*Math.PI/180;
      const θ = (lon + 180)*Math.PI/180;
      return new THREE.Vector3(
        -r * Math.sin(φ)*Math.cos(θ),
         r * Math.cos(φ),
         r * Math.sin(φ)*Math.sin(θ)
      );
    }

    function getCenterOfFeature(f){
      const coords = f.geometry.type==='Polygon'
        ? f.geometry.coordinates.flat()
        : f.geometry.coordinates.flat(2);
      let [minLon,maxLon,minLat,maxLat] = [180,-180,90,-90];
      coords.forEach(([lon,lat])=>{
        minLon = Math.min(minLon, lon);
        maxLon = Math.max(maxLon, lon);
        minLat = Math.min(minLat, lat);
        maxLat = Math.max(maxLat, lat);
      });
      return { centerLon:(minLon+maxLon)/2, centerLat:(minLat+maxLat)/2 };
    }

    function makeFlagImg(code, alt){
      const img = document.createElement('img');
      img.alt = alt;
      const upper = code.toUpperCase();
      const exts  = ['gif','png','jpg']; let idx=0;
      img.src = `./flag/${upper}.${exts[idx++]}`;
      img.onerror = () => {
        if(idx<exts.length){ img.onerror=null; img.src=`./flag/${upper}.${exts[idx++]}`; }
      };
      return img;
    }

    function drawBoundary(feature, color){
      const grp = new THREE.Group();
      const polys = feature.geometry.type==='Polygon'
        ? [feature.geometry.coordinates]
        : feature.geometry.coordinates;
      polys.forEach(poly=> poly.forEach(ring=>{
        const pts = ring.map(([lon,lat])=>lonLatToXYZ(lon,lat,LINE_R));
        if(pts.length&&!pts[0].equals(pts[pts.length-1])) pts.push(pts[0].clone());
        const geom = new THREE.BufferGeometry().setFromPoints(pts);
        grp.add(new THREE.Line(geom, new THREE.LineBasicMaterial({color})));
      }));
      return grp;
    }

    function drawFill(feature, color){
      const grp = new THREE.Group();
      const {centerLon,centerLat} = getCenterOfFeature(feature);
      const polys = feature.geometry.type==='Polygon'
        ? [feature.geometry.coordinates]
        : feature.geometry.coordinates;
      polys.forEach(poly=>{
        const rings2D = poly.map(ring=> ring.map(([lon,lat])=>[(lon-centerLon)*Math.PI/180,(lat-centerLat)*Math.PI/180]));
        const verts2D=[], holes=[], off=0;
        rings2D.forEach((r,i)=>{ if(i>0) holes.push(verts2D.length/2); r.forEach(p=>verts2D.push(...p)); });
        if(verts2D.length<6) return;
        const idxs = earcut(verts2D,holes,2), pos=[];
        idxs.forEach(i=>{
          const x=verts2D[2*i], y=verts2D[2*i+1];
          const lon=centerLon+x*180/Math.PI, lat=centerLat+y*180/Math.PI;
          const v=lonLatToXYZ(lon,lat,FILL_R);
          pos.push(v.x,v.y,v.z);
        });
        const geom = new THREE.BufferGeometry();
        geom.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
        grp.add(new THREE.Mesh(geom, new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.5,side:THREE.FrontSide,depthTest:false,depthWrite:false})));
      });
      return grp;
    }

    function updateLeftPanel(){
      const left = document.getElementById('left-content'); left.innerHTML='';
      const kor = infoData.find(i=>i.iso2==='kr');
      if(!kor) return;
      left.appendChild(makeFlagImg('kr','한국 국기'));
      left.insertAdjacentHTML('beforeend', `<strong>대한민국</strong><br>수도: ${kor.capital}<br>면적: ${kor.area_km2.toLocaleString()} km²<br>인구: ${kor.pop_jul_total.toLocaleString()}명<br>GDP: $${kor.gdp.toLocaleString()}`);
    }

    function updateRightPanel(feature){
      const code = feature.properties.ISO_A2.toLowerCase();
      const info = infoData.find(i=>i.iso2===code);
      const right = document.getElementById('right-content'); right.innerHTML='';
      if(!info) return;
      const name = code==='kr'?'대한민국':info.eng_name;
      right.appendChild(makeFlagImg(code,name+' 국기'));
      right.insertAdjacentHTML('beforeend', `<strong>${name}</strong><br>수도: ${info.capital}<br>면적: ${info.area_km2.toLocaleString()} km²<br>인구: ${info.pop_jul_total.toLocaleString()}명<br>GDP: $${info.gdp.toLocaleString()}`);
    }

    function updateTimes(selectedIso){
      const krEl = document.getElementById('time-kr');
      const timeKR = new Date().toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul',hour12:false});
      krEl.textContent = `🇰🇷 대한민국 시간: ${timeKR}`;
      const selEl = document.getElementById('time-selected');
      const tz = timeZoneMap[selectedIso]||'UTC';
      const timeSel = new Date().toLocaleTimeString('en-US',{timeZone:tz,hour12:false});
      selEl.textContent = `🌐 ${selectedIso.toUpperCase()} 현지 시간: ${timeSel}`;
    }

    function displayCountry(feature){
      if(!feature){ showMessage('국가를 찾을 수 없습니다','error'); return; }
      window.currentFeature = feature;
      showMessage(`${feature.properties.ADMIN} 선택됨`,'success');
      if(curLine) scene.remove(curLine);
      if(curFill) scene.remove(curFill);
      curLine = drawBoundary(feature, feature.properties.ISO_A2.toLowerCase()==='kr'?0x0000ff:0xff0000);
      curFill = drawFill(feature, feature.properties.ISO_A2.toLowerCase()==='kr'?0x0000ff:0xff0000);
      scene.add(curLine,curFill);
      updateLeftPanel(); updateRightPanel(feature);
      updateTimes(feature.properties.ISO_A2.toLowerCase());
      const {centerLon,centerLat} = getCenterOfFeature(feature);
      const tgt = lonLatToXYZ(centerLon,centerLat,R+1.5);
      new TWEEN.Tween(camera.position).to({x:tgt.x,y:tgt.y,z:tgt.z},800).easing(TWEEN.Easing.Quadratic.Out).start();
    }

    function animate(time){ requestAnimationFrame(animate); TWEEN.update(time); controls.update(); renderer.render(scene,camera); }

    async function init(){
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,0.1,100);
      renderer = new THREE.WebGLRenderer({antialias:true});
      renderer.setSize(window.innerWidth,window.innerHeight);
      document.body.appendChild(renderer.domElement);
      controls = new OrbitControls(camera,renderer.domElement);
      controls.enableDamping=true; controls.dampingFactor=0.05; controls.rotateSpeed=0.3;
      scene.add(new THREE.Mesh(new THREE.SphereGeometry(R,64,64), new THREE.MeshBasicMaterial({map:new THREE.TextureLoader().load('eo_base_2020_clean_geo_optimized.jpg')})));
      const csvText = await fetch('country_info_198.csv').then(r=>r.text());
      infoData = Papa.parse(csvText,{header:true,skipEmptyLines:true,transformHeader:h=>h.replace(/^\uFEFF/,'').trim()}).data.map(r=>({iso2:r.iso2.toLowerCase(),eng_name:r.eng_name,area_km2:+r.area_km2,pop_jul_total:+r.pop_jul_total,gdp:+r.gdp,capital:r.capital}));
      geoJSON = await fetch('countries.geojson').then(r=>r.json());
      const korF = geoJSON.features.find(f=>f.properties.ADMIN.toLowerCase().includes('korea'));
      scene.add(drawBoundary(korF,0x0000ff), drawFill(korF,0x0000ff));
      const dl = document.getElementById('country-names'); geoJSON.features.forEach(f=>{const opt=document.createElement('option');opt.value=f.properties.ADMIN;dl.appendChild(opt);});
      displayCountry(korF);
      const {centerLon,centerLat} = getCenterOfFeature(korF);
      camera.position.copy(lonLatToXYZ(centerLon,centerLat,R+1.5)); controls.target.set(0,0,0);
      document.getElementById('searchBtn').onclick = ()=>{const q=document.getElementById('iso-code').value.trim().toLowerCase(); let f=geoJSON.features.find(ff=>ff.properties.ADMIN.toLowerCase()===q); if(!f) f=geoJSON.features.find(ff=>ff.properties.ADMIN.toLowerCase().includes(q)); displayCountry(f);};
      window.addEventListener('resize',()=>{camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight);});
      animate();
    }

    window.onload = init;
  </script>
</body>
</html>
