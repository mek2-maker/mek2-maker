<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>대한민국 지도 + 오버레이 피라미드</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }
    #map {
      width: 100%;
      height: 100%;
    }

    /* 전국 피라미드 (오른쪽 상단) */
    #nationalPyramid {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 400px;
      height: 400px;
      border: 1px solid #ccc;
      background: #fff;
      z-index: 1000;
    }

    /* 지역 피라미드 (오른쪽 상단 아래) */
    #regionalPyramid {
      position: absolute;
      top: 420px; /* national 바로 아래 */
      right: 10px;
      width: 400px;
      height: 400px;
      border: 1px solid #ccc;
      background: #fff;
      z-index: 1000;
      display: none;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- 전국 인구 피라미드 -->
  <iframe id="nationalPyramid"
          src="https://mek2-maker.github.io/mek2-maker/korea_population_pyramid.html"
          frameborder="0">
  </iframe>

  <!-- 지역 인구 피라미드 (처음엔 숨김) -->
  <iframe id="regionalPyramid"
          src=""
          frameborder="0">
  </iframe>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // 지도
    var map = L.map('map').setView([36.5, 127.5], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // 시도이름→파일명
    function getFileName(name) {
      const map = {
        "서울특별시": "seoul",
        "부산광역시": "busan",
        // ... 나머지 맵핑 ...
      };
      return map[name] || null;
    }

    // GeoJSON
    fetch('https://raw.githubusercontent.com/mek2-maker/mek2-maker/main/skorea-provinces-2018-geo.json')
      .then(res => res.json())
      .then(geoData => {
        L.geoJSON(geoData, {
          style: { color: '#3388ff', weight: 2, fillOpacity: 0.1 },
          onEachFeature: function(f, layer) {
            layer.on('click', function() {
              const fileKey = getFileName(f.properties.name);
              if (fileKey) {
                const iframe = document.getElementById('regionalPyramid');
                iframe.src = `https://mek2-maker.github.io/mek2-maker/${fileKey}_population_pyramid.html`;
                iframe.style.display = 'block';
              } else {
                alert('해당 지역 파일 없음');
              }
            });
          }
        }).addTo(map);
      });

    // 메시지 중계 (전국↔지역)
    window.addEventListener("message", function(event) {
      if (!event.data || event.data.type !== 'frameChange') return;
      var national = document.getElementById('nationalPyramid');
      var regional = document.getElementById('regionalPyramid');
      if (event.source === national.contentWindow) {
        if (regional.style.display !== 'none') {
          regional.contentWindow.postMessage(event.data, "*");
        }
      } else if (event.source === regional.contentWindow) {
        national.contentWindow.postMessage(event.data, "*");
      }
    });
  </script>
</body>
</html>
