<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>대한민국 지도 및 인구 피라미드 (절대 가로 2단)</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    /* 전체 페이지를 Flex 컨테이너로 설정 (wrap 방지) */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: row;  /* 자식들을 가로로 배치 */
      flex-wrap: nowrap;    /* 랩핑되지 않도록 */
      overflow: auto;       /* 공간이 부족할 경우 가로 스크롤 발생 */
    }

    /* 왼쪽: 지도 영역 */
    #map {
      flex: 1 1 auto;      /* 남은 공간 모두 채움 */
      min-width: 400px;    /* 최소 너비 지정 */
      height: 100%;
    }

    /* 오른쪽: 피라미드 패널 (고정 폭) */
    #pyramidPanel {
      flex: 0 0 500px;     /* 너비 500px 고정 (원하는 값으로 수정 가능) */
      min-width: 350px;
      background: #fff;
      border-left: 1px solid #ccc;
      height: 100%;
      display: flex;
      flex-direction: column;  /* 내부 요소(iframe) 상하 배치 */
    }

    /* 각 iframe (전국, 시도 피라미드) */
    #nationalPyramid, #regionalPyramid {
      width: 100%;
      border: none;
    }
    #nationalPyramid {
      height: 50%;  /* 패널 높이의 절반 */
    }
    #regionalPyramid {
      height: 50%;  /* 패널 높이의 절반 */
      display: none;  /* 기본적으로 숨김 */
    }
  </style>
</head>
<body>
  <!-- 지도 영역 -->
  <div id="map"></div>

  <!-- 오른쪽 피라미드 패널 -->
  <div id="pyramidPanel">
    <iframe id="nationalPyramid" 
            src="https://mek2-maker.github.io/mek2-maker/korea_population_pyramid.html">
    </iframe>
    <iframe id="regionalPyramid" src="">
    </iframe>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // 지도 초기화: 중심좌표(대한민국 중앙)와 줌 레벨 지정
    var map = L.map('map').setView([36.5, 127.5], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // 시도 이름과 해당 파일명을 매핑하는 함수
    function getFileName(provinceName) {
      const provinceMap = {
        '서울특별시': 'seoul',
        '부산광역시': 'busan',
        '대구광역시': 'daegu',
        '인천광역시': 'incheon',
        '광주광역시': 'gwangju',
        '대전광역시': 'daejeon',
        '울산광역시': 'ulsan',
        '세종특별자치시': 'sejong',
        '경기도': 'gyeonggi',
        '강원도': 'gangwon',
        '충청북도': 'chungbuk',
        '충청남도': 'chungnam',
        '전라북도': 'jeonbuk',
        '전라남도': 'jeonnam',
        '경상북도': 'gyeongbuk',
        '경상남도': 'gyeongnam',
        '제주특별자치도': 'jeju'
      };
      return provinceMap[provinceName] || null;
    }

    // GeoJSON 데이터 로드 및 지도에 시도 경계를 추가하고 클릭 이벤트 등록
    fetch('https://raw.githubusercontent.com/mek2-maker/mek2-maker/main/skorea-provinces-2018-geo.json')
      .then(response => {
        if (!response.ok) throw new Error('네트워크 응답 오류');
        return response.json();
      })
      .then(geoData => {
        L.geoJSON(geoData, {
          style: { color: '#3388ff', weight: 2, fillOpacity: 0.1 },
          onEachFeature: function(feature, layer) {
            layer.on('click', function() {
              const name = feature.properties.name;
              console.log(name + " 클릭됨");
              const fileKey = getFileName(name);
              if (fileKey) {
                var regionalIframe = document.getElementById('regionalPyramid');
                var newSrc = `https://mek2-maker.github.io/mek2-maker/${fileKey}_population_pyramid.html`;
                console.log("로딩할 regional 피라미드 URL:", newSrc);
                regionalIframe.src = newSrc;
                regionalIframe.style.display = 'block';
              } else {
                alert("해당 지역의 피라미드 파일이 없습니다.");
              }
            });
          }
        }).addTo(map);
      })
      .catch(error => {
        console.error('GeoJSON 로드 에러:', error);
      });

    // 부모 창 및 iframe 간 동기화를 위한 메시지 이벤트 리스너 (디버그 로그 포함)
    window.addEventListener("message", function(event) {
      console.log("부모 창에서 메시지 수신:", event.data, "출처:", event.source);
      if (event.data && event.data.type === "frameChange") {
        var nationalIframe = document.getElementById('nationalPyramid');
        var regionalIframe = document.getElementById('regionalPyramid');

        // 전국 피라미드에서 보낸 메시지인 경우 (regional이 보이는 경우)
        if (event.source === nationalIframe.contentWindow) {
          console.log("전국 피라미드에서 온 메시지:", event.data);
          if (regionalIframe.style.display !== 'none') {
            regionalIframe.contentWindow.postMessage(event.data, "*");
            console.log("regional 피라미드로 메시지 전송:", event.data);
          }
        }
        // 시도 피라미드에서 보낸 메시지인 경우
        else if (event.source === regionalIframe.contentWindow) {
          console.log("시도 피라미드에서 온 메시지:", event.data);
          nationalIframe.contentWindow.postMessage(event.data, "*");
          console.log("national 피라미드로 메시지 전송:", event.data);
        } else {
          console.log("알 수 없는 출처의 메시지:", event.data);
        }
      }
    });
  </script>
</body>
</html>
