<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>대한민국 지도 및 인구 피라미드 (오버레이 스타일)</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    /* HTML, BODY 전체를 지도에 활용 */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    /* 지도는 전체 차지 */
    #map {
      width: 100%;
      height: 100%;
    }

    /* 전국 피라미드: 오른쪽 상단에 띄우기 */
    #nationalPyramid {
      position: absolute;  /* 오버레이 배치 */
      top: 10px;
      right: 10px;
      width: 400px;       /* 크기나 비율은 상황에 따라 조정 */
      height: 200px;
      z-index: 1000;      /* 지도보다 위로 */
      border: 1px solid #ccc;
      background: #fff;
    }

    /* 시도(지역) 피라미드: 전국 아래쪽에 오버레이 (처음엔 숨김) */
    #regionalPyramid {
      position: absolute;
      top: 420px;         /* national 아래로 배치 */
      right: 10px;
      width: 400px;
      height: 200px;
      z-index: 1000;
      border: 1px solid #ccc;
      background: #fff;
      display: none;      /* 맨 처음엔 안 보이도록 */
    }
  </style>
</head>
<body>

  <!-- 지도 엘리먼트 -->
  <div id="map"></div>

  <!-- 전국 인구 피라미드 (처음엔 보임) -->
  <iframe id="nationalPyramid"
          src="https://mek2-maker.github.io/mek2-maker/korea_population_pyramid.html"
          frameborder="0">
  </iframe>

  <!-- 지역 인구 피라미드 (처음엔 숨김) -->
  <iframe id="regionalPyramid"
          src=""
          frameborder="0">
  </iframe>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // 1. 지도 초기화
    var map = L.map('map').setView([36.5, 127.5], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // 2. 시도 이름 → 파일명 맵핑
    function getFileName(provinceName) {
      const provinceMap = {
        '서울특별시': 'seoul',
        '부산광역시': 'busan',
        '대구광역시': 'daegu',
        '인천광역시': 'incheon',
        '광주광역시': 'gwangju',
        '대전광역시': 'daejeon',
        '울산광역시': 'ulsan',
        '세종특별자치시': 'sejong',
        '경기도': 'gyeonggi',
        '강원도': 'gangwon',
        '충청북도': 'chungbuk',
        '충청남도': 'chungnam',
        '전라북도': 'jeonbuk',
        '전라남도': 'jeonnam',
        '경상북도': 'gyeongbuk',
        '경상남도': 'gyeongnam',
        '제주특별자치도': 'jeju'
      };
      return provinceMap[provinceName] || null;
    }

    // 3. GeoJSON 불러와서 지도에 올리기
    fetch('https://raw.githubusercontent.com/mek2-maker/mek2-maker/main/skorea-provinces-2018-geo.json')
      .then(response => {
        if (!response.ok) throw new Error('네트워크 응답 실패');
        return response.json();
      })
      .then(geoData => {
        L.geoJSON(geoData, {
          style: { color: '#3388ff', weight: 2, fillOpacity: 0.1 },
          onEachFeature: function(feature, layer) {
            layer.on('click', function() {
              const name = feature.properties.name;
              console.log(name + " 클릭됨");
              const fileKey = getFileName(name);

              if (fileKey) {
                // 지역 iframe 준비
                var regionalIframe = document.getElementById('regionalPyramid');
                var newSrc = `https://mek2-maker.github.io/mek2-maker/${fileKey}_population_pyramid.html`;
                console.log("로딩할 지역 피라미드:", newSrc);

                // src 바꾸고 보이게
                regionalIframe.src = newSrc;
                regionalIframe.style.display = 'block';
              } else {
                alert("해당 지역의 피라미드 파일이 없습니다.");
              }
            });
          }
        }).addTo(map);
      })
      .catch(err => {
        console.error("GeoJSON 로드 에러:", err);
      });

    // 4. 전국↔시도 슬라이더 동기화용 메시지 중계
    window.addEventListener("message", function(event) {
      // 메시지 구조 검사
      if (!event.data || event.data.type !== 'frameChange') return;

      // iframe 참조
      var nationalIframe = document.getElementById('nationalPyramid');
      var regionalIframe = document.getElementById('regionalPyramid');

      // 전국 → 지역
      if (event.source === nationalIframe.contentWindow) {
        if (regionalIframe.style.display !== 'none') {
          regionalIframe.contentWindow.postMessage(event.data, "*");
        }
      }
      // 지역 → 전국
      else if (event.source === regionalIframe.contentWindow) {
        nationalIframe.contentWindow.postMessage(event.data, "*");
      }
    });
  </script>
</body>
</html>
