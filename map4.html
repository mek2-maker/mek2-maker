<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>대한민국 지도 및 인구 피라미드 (동기화 예시 + 디버그)</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    #map {
      height: 100%;
    }
    #nationalPyramid {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 40%;
      height: 500px;
      border: 1px solid #ccc;
      z-index: 1000;
      background: white;
    }
    #regionalPyramid {
      position: absolute;
      top: 520px;  /* 전국 피라미드 아래 */
      right: 10px;
      width: 40%;
      height: 500px;
      border: 1px solid #ccc;
      z-index: 1000;
      background: white;
      display: none;  /* 초기엔 숨김 */
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- 전국 인구 피라미드 (iframe) -->
  <iframe id="nationalPyramid" 
          src="https://mek2-maker.github.io/mek2-maker/korea_population_pyramid.html" 
          frameborder="0">
  </iframe>

  <!-- 시도 인구 피라미드 (iframe, 처음엔 비활성) -->
  <iframe id="regionalPyramid"
          src=""
          frameborder="0">
  </iframe>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    // 지도 초기화
    var map = L.map('map').setView([36.5, 127.5], 7);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // 시도 이름을 파일명으로 변환하는 함수
    function getFileName(provinceName) {
      const provinceMap = {
        '서울특별시': 'seoul',
        '부산광역시': 'busan',
        '대구광역시': 'daegu',
        '인천광역시': 'incheon',
        '광주광역시': 'gwangju',
        '대전광역시': 'daejeon',
        '울산광역시': 'ulsan',
        '세종특별자치시': 'sejong',
        '경기도': 'gyeonggi',
        '강원도': 'gangwon',
        '충청북도': 'chungbuk',
        '충청남도': 'chungnam',
        '전라북도': 'jeonbuk',
        '전라남도': 'jeonnam',
        '경상북도': 'gyeongbuk',
        '경상남도': 'gyeongnam',
        '제주특별자치도': 'jeju'
      };
      return provinceMap[provinceName] || null;
    }

    // GeoJSON 데이터 로드 및 시도 클릭 이벤트 설정
    fetch('https://raw.githubusercontent.com/mek2-maker/mek2-maker/main/skorea-provinces-2018-geo.json')
      .then(response => {
        if (!response.ok) throw new Error('네트워크 응답 오류');
        return response.json();
      })
      .then(geoData => {
        L.geoJSON(geoData, {
          style: { color: '#3388ff', weight: 2, fillOpacity: 0.1 },
          onEachFeature: function(feature, layer) {
            layer.on('click', function() {
              const name = feature.properties.name;
              console.log(name + " 클릭됨");
              const fileKey = getFileName(name);
              if (fileKey) {
                var regionalIframe = document.getElementById('regionalPyramid');
                var newSrc = `https://mek2-maker.github.io/mek2-maker/${fileKey}_population_pyramid.html`;
                console.log("로딩할 regional 피라미드 URL:", newSrc);
                regionalIframe.src = newSrc;
                regionalIframe.style.display = 'block';
              } else {
                alert("해당 지역의 피라미드 파일이 없습니다.");
              }
            });
          }
        }).addTo(map);
      })
      .catch(error => {
        console.error('GeoJSON 로드 에러:', error);
      });

    // 부모 창에서 두 피라미드 간 동기화 메시지 중계 및 디버그 로그
    window.addEventListener("message", function(event) {
    console.log("부모 창에서 메시지 수신:", event.data, "출처:", event.source);

    if (event.data && event.data.type === "frameChange") {
      var nationalIframe = document.getElementById('nationalPyramid');
      var regionalIframe = document.getElementById('regionalPyramid');

      // 전국 피라미드에서 온 메시지일 경우 (그리고 regional iframe이 보이는 경우)
      if (event.source === nationalIframe.contentWindow) {
        console.log("메시지가 전국 피라미드에서 왔습니다. regional 피라미드로 전송 (regional iframe display:", regionalIframe.style.display, ")");
        if (regionalIframe.style.display !== 'none') {
          regionalIframe.contentWindow.postMessage(event.data, "*");
          console.log("regional 피라미드로 메시지 전송:", event.data);
        }
      }
      // 시도(지역) 피라미드에서 온 메시지일 경우
      else if (event.source === regionalIframe.contentWindow) {
        console.log("메시지가 시도 피라미드에서 왔습니다. national 피라미드로 전송");
        nationalIframe.contentWindow.postMessage(event.data, "*");
        console.log("national 피라미드로 메시지 전송:", event.data);
      } else {
        console.log("알 수 없는 출처에서 온 메시지:", event.data);
      }
    }
  });
  </script>
</body>
</html>
