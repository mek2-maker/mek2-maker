<!DOCTYPE html>
<html lang="ko">
<head>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            background-color: #f4f7fa;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        #pyramid {
            width: 100%;
            max-width: 900px;
            margin: auto;
        }
        .barlayer .bars path {
            fill-opacity: 1;
            stroke-width: 0.5;
            stroke: rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div id="pyramid"></div>
    <script>
        // responsive layout 함수
        function getResponsiveLayout() {
            let width = Math.min(window.innerWidth * 0.9, 500);
            let height = Math.min(window.innerHeight * 0.7, 300);
            let fontSize = Math.max(10, Math.min(16, width / 20));

            return {
                autosize: true,
                width: width,
                height: height,
                xaxis: { title: "인구 수", tickfont: { size: fontSize } },
                yaxis: { title: "연령대", tickfont: { size: fontSize } },
                barmode: "relative"
            };
        }

        // 창 크기 변경 시 레이아웃 업데이트
        window.addEventListener('resize', function() {
            Plotly.relayout('pyramid', getResponsiveLayout());
        });

        // JSON 파일 불러오기 및 플롯 생성
        let fig_pyramid;
        fetch('https://raw.githubusercontent.com/mek2-maker/mek2-maker/main/population_pyramid.json')
        .then(response => response.json())
        .then(data => {
            fig_pyramid = data;
            Plotly.newPlot('pyramid', fig_pyramid.data, getResponsiveLayout()).then(function() {
                Plotly.addFrames('pyramid', fig_pyramid.frames);
            });
        })
        .catch(error => console.error("JSON 로드 오류:", error));

        // 애니메이션 설정 (부드럽게, 속도 조절)
        let currentFrame = 0;
        let interval = null;

        function animateChart() {
            if(interval) clearInterval(interval);
            currentFrame = 0;
            interval = setInterval(() => {
                Plotly.animate('pyramid', fig_pyramid.frames[currentFrame].name, {
                    frame: { duration: 100, redraw: true },
                    transition: { duration: 100, easing: "ease-in-out" }
                });
                Plotly.relayout('pyramid', {'sliders[0].active': currentFrame});
                currentFrame++;
                if(currentFrame >= fig_pyramid.frames.length) clearInterval(interval);
            }, 100);
        }

        // 플레이/일시정지 버튼에 이벤트 연결 (버튼이 로드된 후)
        setTimeout(() => {
            let playBtn = document.querySelector("[data-title='PLAY']");
            let pauseBtn = document.querySelector("[data-title='PAUSE']");
            if(playBtn) playBtn.onclick = animateChart;
            if(pauseBtn) pauseBtn.onclick = () => clearInterval(interval);
        }, 1000);
    </script>
</body>
</html>
