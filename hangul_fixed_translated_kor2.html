<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>HANGUL Jamo Chart</title>
  <style>
    /* ── 기본 레이아웃 ── */
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      box-sizing: border-box;
      font-family: sans-serif;
    }
    h1 {
      text-align: center;
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      margin: 0 0 5px;
    }
    .controls {
      text-align: center;
      margin-top: 10px;
    }
    .result {
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      margin-bottom: 3px;
    }
    #reset-btn {
      font-size: 1rem;
      padding: 5px 10px;
      cursor: pointer;
    }

    /* ── 차트 컨테이너 ── */
    .chart-container {
      margin: 0 -20px;
      padding: 0;
      width:  calc(100% + 40px);
      /* 제목(≈36px) + 컨트롤(≈60px) + 여백(≈20px) 빼고 꽉 채움 */
      height: calc(100vh - 116px);
      overflow: hidden;
    }
    .chart {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: nowrap;
      transform-origin: top center;
      /* transform 은 JS 로 동적 적용 */
    }

    /* ── 블록 & 버튼 ── */
    .block {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px;
      width: 200px;
    }
    .block h2 {
      font-size: 1rem;
      margin: 0 0 8px;
      text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .grid button {
      padding: 8px;
      border: 1px solid #888;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-size: 1.1rem;
      position: relative;
    }
    .grid .roma {
      display: block;
      font-size: 0.8rem;
      color: #555;
      margin-top: 4px;
    }
    .grid button.none-label {
      font-size: 0.6rem;
      line-height: 1;
    }
    .grid button.disabled {
      background: #ddd;
      border-color: #aaa;
      color: #666;
      cursor: default;
      pointer-events: none;
    }
    .grid button.selected {
      background: #cce5ff;
      border-color: #3399ff;
    }
  </style>
</head>
<body>
  <h1>HANGUL Jamo Chart</h1>

  <!-- 자동 축소 영역 -->
  <div class="chart-container">
    <div class="chart" id="chart">
      <div class="block">
        <h2>Initial Consonants</h2>
        <div class="grid" id="chosung-grid"></div>
      </div>
      <div class="block">
        <h2>Medial Vowels</h2>
        <div class="grid" id="jungsung-grid"></div>
      </div>
      <div class="block">
        <h2>Final Consonants</h2>
        <div class="grid" id="jongsung-grid"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="result" id="syllable-output">Select an initial consonant</div>
    <button id="reset-btn">Reset</button>
  </div>

<script>
  // 음성 합성용
  let ALL_VOICES = [];
  speechSynthesis.onvoiceschanged = () => { ALL_VOICES = speechSynthesis.getVoices(); };
  speechSynthesis.getVoices();
  async function speakKorean(txt) {
    if (!ALL_VOICES.length) await new Promise(r => setTimeout(r,100));
    const voices = ALL_VOICES.length ? ALL_VOICES : speechSynthesis.getVoices();
    let kor = voices.find(v=>v.lang==='ko-KR') 
           || voices.find(v=>v.lang.startsWith('ko'))
           || voices[0];
    const u = new SpeechSynthesisUtterance(txt);
    u.voice = kor; u.lang = kor.lang; u.rate = 0.9;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }

  // 유효 음절 Set
  const VALID = new Set(JSON.parse(document.getElementById('valid-data').textContent));

  // 자모 정의
  const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
  const FULL_JONG = ['', 'ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

  // 그리드 엘리먼트
  const choGrid  = document.getElementById('chosung-grid');
  const jungGrid = document.getElementById('jungsung-grid');
  const jongGrid = document.getElementById('jongsung-grid');
  const out      = document.getElementById('syllable-output');
  const resetBtn = document.getElementById('reset-btn');

  let choSel = null, jungSel = null;
  let word = '';  // 누적 단어

  // 출력 갱신
  function updateOutputGuide() {
    out.textContent = word ? word : 'Select an initial consonant';
  }

  // 초기화 함수
  function resetAll() {
    choSel = jungSel = null;
    word = '';
    [choGrid,jungGrid,jongGrid].forEach(g =>
      g.querySelectorAll('button').forEach(b => b.classList.remove('selected','disabled'))
    );
    // 초성만 활성, 나머지는 비활성
    jungGrid.querySelectorAll('button').forEach(b=>b.classList.add('disabled'));
    jongGrid.querySelectorAll('button').forEach(b=>b.classList.add('disabled'));
    updateOutputGuide();
  }

  // 한 글자(음절) 완성 후 처리: word에 추가하고 다음 글자 시작 상태로
  function commitSyllable(idxFinal) {
    const code = 0xAC00 + (choSel*21 + jungSel)*28 + idxFinal;
    const syll = String.fromCharCode(code);

    // 유효성: 종성이 있고 VALID에 없으면 무시
    if (idxFinal !== 0 && !VALID.has(syll)) return;

    word += syll;
    out.textContent = word;
    speakKorean(syll);

    // 다음 글자를 만들 수 있도록 선택/버튼 상태만 초기화 (진짜 리셋 아님)
    choSel = jungSel = null;

    choGrid.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));
    jungGrid.querySelectorAll('button').forEach(x=>{
      x.classList.remove('selected');
      x.classList.add('disabled');      // 다시 초성부터 선택하도록
    });
    jongGrid.querySelectorAll('button').forEach(x=>{
      x.classList.remove('selected');
      x.classList.add('disabled');
    });
  }

  // 차트 생성
  function initChart() {
    // 초성
    const CHO_ROMA = ['g','kk','n','d','tt','r','m','b','pp','s','ss','ng','j','jj','ch','k','t','p','h'];
    CHO.forEach((c,i) => {
      const btn = document.createElement('button');
      btn.innerHTML = `<span>${c}</span><span class="roma">${CHO_ROMA[i]}</span>`;
      btn.addEventListener('click', () => {
        choSel = i; jungSel = null;
        choGrid.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));
        btn.classList.add('selected');
        // 중성 활성
        jungGrid.querySelectorAll('button').forEach(x=>x.classList.remove('disabled'));
        // 종성은 아직 비활성
        jongGrid.querySelectorAll('button').forEach(x=>x.classList.add('disabled'));
        // 안내는 유지: 누적 단어 또는 안내문
        updateOutputGuide();
      });
      choGrid.appendChild(btn);
    });

    // 중성
    const JUNG_ROMA = ['a','ae','ya','yae','eo','e','yeo','ye','o','wa','wae','oe','yo','u','wo','we','wi','yu','eu','ui','i'];
    JUNG.forEach((c,j) => {
      const btn = document.createElement('button');
      btn.innerHTML = `<span>${c}</span><span class="roma">${JUNG_ROMA[j]}</span>`;
      btn.classList.add('disabled');
      btn.addEventListener('click', () => {
        if (choSel===null) return;
        jungSel = j;
        jungGrid.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));
        btn.classList.add('selected');

        // 중성까지 고르면 종성 후보 활성/필터링
        jongGrid.querySelectorAll('button').forEach(x=>{
          const idx = +x.dataset.idx;
          const test = String.fromCharCode(0xAC00 + (choSel*21 + jungSel)*28 + idx);
          x.classList.toggle('disabled', idx!==0 && !VALID.has(test));
          x.classList.remove('selected');
        });
      });
      jungGrid.appendChild(btn);
    });

    // 종성
    FULL_JONG.forEach((c,k) => {
      const btn = document.createElement('button');
      btn.textContent = c || '(none)';
      if (!c) btn.classList.add('none-label');
      btn.dataset.idx = k;
      btn.classList.add('disabled');
      btn.addEventListener('click', () => {
        if (choSel===null||jungSel===null) return;
        jongGrid.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));
        btn.classList.add('selected');

        // 선택된 종성으로 음절 확정 → 누적 + 다음 글자 준비
        commitSyllable(+btn.dataset.idx);
      });
      jongGrid.appendChild(btn);
    });

    resetBtn.addEventListener('click', resetAll);
    resetAll();
  }

  // 컨테이너 크기에 맞춰 자동 축소
  function resizeChart() {
    const container = document.querySelector('.chart-container');
    const chart     = document.getElementById('chart');
    const cw = container.clientWidth;
    const ch = container.clientHeight;
    const bw = chart.scrollWidth;
    const bh = chart.scrollHeight;
    // 필요한 경우만 축소
    const scale = Math.min(cw/bw, ch/bh, 1);
    chart.style.transform = `scale(${scale})`;
  }

  // 초기화 & 이벤트 바인딩
  window.addEventListener('load', () => {
    initChart();
    resizeChart();
  });
  window.addEventListener('resize', resizeChart);
</script>
