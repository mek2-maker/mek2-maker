<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>B 인포그래픽</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>body{margin:0;font-family:sans-serif;}svg{width:100%;height:100%}</style>
</head>
<body>
  <svg id="svgB" width="400" height="300"></svg>
  <script>
    const dataB = [
      [100,150,120],
      [110,140,130],
      [120,130,140],
      [130,120,150],
      [140,110,160]
    ];

    const svg = d3.select('#svgB');
    const W = +svg.attr('width'), H = +svg.attr('height');
    const n = dataB[0].length, barW = (W-40)/n;

    // 렌더 함수
    function render(i) {
      if (i<0||i>=dataB.length) return;
      const pops = dataB[i];
      // bar
      const bars = svg.selectAll('rect').data(pops);
      bars.enter().append('rect')
          .attr('x',(d,j)=>20+j*barW)
          .attr('width',barW-5)
          .attr('y',H-20).attr('height',0)
        .merge(bars)
          .transition().duration(300)
          .attr('y',d=>H-d-20).attr('height',d=>d);
      bars.exit().remove();
      // label
      const labs = svg.selectAll('text').data(pops);
      labs.enter().append('text')
          .attr('x',(d,j)=>20+j*barW+(barW-5)/2)
          .attr('y',H-5).attr('text-anchor','middle')
          .text((d,j)=>`지역 ${j+1}`)
        .merge(labs).text((d,j)=>`지역 ${j+1}`);
      labs.exit().remove();
    }

    render(0);

    const channel = new BroadcastChannel('timesync');
    channel.onmessage = ev => render(ev.data);
  </script>
</body>
</html>
