<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>3D 지구본 (경계선 내부 국기 표시, South Korea 경계 유지)</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <style>
    body { margin: 0; overflow: hidden; }
    #overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(255,255,255,0.9);
      padding: 10px;
      border-radius: 5px;
      font-family: sans-serif;
      width: 300px;
      max-width: 80vw;
      box-sizing: border-box;
    }
    #results {
      margin-top: 10px;
      max-height: 150px;
      overflow-y: auto;
    }
    .result-item {
      padding: 5px;
      border-bottom: 1px solid #ccc;
      cursor: pointer;
    }
    .result-item:hover { background-color: #eee; }
    #overlay input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 5px;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <label for="iso-code">국가명 검색 (예: Korea, China):</label>
    <input type="text" id="iso-code" placeholder="국가명을 입력하세요">
    <button id="searchBtn">검색</button>
    <div id="results"></div>
  </div>

  <script type="module">
    import * as THREE from './libs/three.module.js';
    import { OrbitControls } from './libs/OrbitControls.js';
    import TWEEN from './libs/tween.esm.js';
    import earcut from './libs/earcut.js';
    import * as turf from './node_modules/@turf/turf/dist/esm/index.js';
    
    let scene, camera, renderer, controls;
    const globeRadius = 1;
    let globeMesh;
    let countryGeoJSON = null;

    let currentFlagMesh = null;
    let currentBoundaryLine = null;
    let koreaBoundaryLine = null;

    function lonLatToXYZ(lon, lat, radius = globeRadius) {
      const phi = (90 - lat) * (Math.PI / 180);
      const theta = (lon + 180) * (Math.PI / 180);
      return new THREE.Vector3(
        -radius * Math.sin(phi) * Math.cos(theta),
        radius * Math.cos(phi),
        radius * Math.sin(phi) * Math.sin(theta)
      );
    }

    async function loadGeoJSON() {
      try {
        const response = await fetch('countries.geojson');
        countryGeoJSON = await response.json();
        console.log("GeoJSON 로드 완료");
      } catch (err) {
        console.error("GeoJSON 로드 실패:", err);
      }
    }

    async function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(2, 2, 2);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.update();

      const textureLoader = new THREE.TextureLoader();
      const globeTexture = textureLoader.load('eo_base_2020_clean_geo_optimized.jpg');
      const sphereMaterial = new THREE.MeshBasicMaterial({ map: globeTexture });
      const sphereGeometry = new THREE.SphereGeometry(globeRadius, 64, 64);
      globeMesh = new THREE.Mesh(sphereGeometry, sphereMaterial);
      scene.add(globeMesh);

      await loadGeoJSON();
      document.getElementById('iso-code').value = "south korea";
      searchCountries();
      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    function searchCountries() {
      const searchTerm = document.getElementById('iso-code').value.trim().toLowerCase();
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = "";
      if (!countryGeoJSON) {
        alert("GeoJSON 데이터가 아직 로드되지 않았습니다.");
        return;
      }
      const matches = countryGeoJSON.features.filter(feature => {
        return feature.properties.ADMIN.toLowerCase().includes(searchTerm);
      });
      if (matches.length === 1) {
        document.getElementById('iso-code').value = matches[0].properties.ADMIN;
        displayCountry(matches[0]);
      } else {
        matches.forEach(feature => {
          const div = document.createElement('div');
          div.className = "result-item";
          div.textContent = feature.properties.ADMIN;
          div.addEventListener('click', () => {
            displayCountry(feature);
            document.getElementById('iso-code').value = feature.properties.ADMIN;
            resultsDiv.innerHTML = "";
          });
          resultsDiv.appendChild(div);
        });
      }
    }

    function displayCountry(feature) {
      drawCountryBoundary(feature);
      const { centerPos } = getBoundsCenter(feature);
      new TWEEN.Tween(camera.position)
        .to({ x: centerPos.x * 2.2, y: centerPos.y * 2.2, z: centerPos.z * 2.2 }, 1000)
        .easing(TWEEN.Easing.Quadratic.Out)
        .onComplete(() => {
          controls.target.copy(centerPos);
          controls.update();
        })
        .start();
    }

    function getBoundsCenter(feature) {
      const centroid = turf.centroid(feature);
      const [cLon, cLat] = centroid.geometry.coordinates;
      return { centerPos: lonLatToXYZ(cLon, cLat, globeRadius + 0.02) };
    }

    function drawCountryBoundary(feature) {
      if (currentBoundaryLine) {
        scene.remove(currentBoundaryLine);
      }
      currentBoundaryLine = createBoundaryLineGroup(feature);
      scene.add(currentBoundaryLine);
    }

    function createBoundaryLineGroup(feature) {
      const lineGroup = new THREE.Group();
      feature.geometry.coordinates.forEach(ring => {
        const points = ring[0].map(([lon, lat]) => lonLatToXYZ(lon, lat, globeRadius + 0.02));
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const material = new THREE.LineBasicMaterial({ color: 0xff0000 });
        const line = new THREE.Line(geometry, material);
        lineGroup.add(line);
      });
      return lineGroup;
    }

    window.onload = init;
    document.getElementById('searchBtn').addEventListener('click', searchCountries);
  </script>
</body>
</html>
