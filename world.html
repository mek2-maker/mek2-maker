<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>3D 지구본 (경계선 내부 국기 표시, South Korea 경계 유지)</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline';">
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(255,255,255,0.9);
      padding: 10px;
      border-radius: 5px;
      font-family: sans-serif;
      width: 300px;
      max-width: 80vw;
      box-sizing: border-box;
    }
    #results {
      margin-top: 10px;
      max-height: 150px;
      overflow-y: auto;
    }
    .result-item {
      padding: 5px;
      border-bottom: 1px solid #ccc;
      cursor: pointer;
    }
    .result-item:hover { background-color: #eee; }
    #overlay input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 5px;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <label for="iso-code">국가명 검색 (예: Korea, China):</label>
    <input type="text" id="iso-code" placeholder="국가명을 입력하세요">
    <button id="searchBtn">검색</button>
    <div id="results"></div>
  </div>

  <script type="module">
    import * as THREE from './libs/three.module.js';
    import { OrbitControls } from './libs/OrbitControls.js';
    import TWEEN from './libs/tween.esm.js';
    import earcut from './libs/earcut.js';

    let scene, camera, renderer, controls;
    const globeRadius = 1;
    let globeMesh;
    let countryGeoJSON = null;

    let currentFlagMesh = null;
    let currentBoundaryLine = null;
    let koreaBoundaryLine = null;

    function getISO2(feature) {
      const iso2 = feature.properties.ISO_A2;
      return iso2 ? iso2.trim() : null;
    }

    function getCountryName(feature) {
      return feature.properties.ADMIN;
    }

    function lonLatToXYZ(lon, lat, radius = globeRadius) {
      const phi = (90 - lat) * Math.PI / 180;
      const theta = (lon + 180) * Math.PI / 180;
      const x = -radius * Math.sin(phi) * Math.cos(theta);
      const z = radius * Math.sin(phi) * Math.sin(theta);
      const y = radius * Math.cos(phi);
      return new THREE.Vector3(x, y, z);
    }

    function addDebugPoint(lon, lat, color = 0xff0000) {
      const sphere = new THREE.Mesh(
        new THREE.SphereGeometry(0.002, 8, 8),  // 크기 작게
        new THREE.MeshBasicMaterial({ color })
      );
      // 📌 위치는 지구 표면과 거의 동일하게
      const pos = lonLatToXYZ(lon, lat, globeRadius + 0.001);
      sphere.position.copy(pos);
      scene.add(sphere);
    }

    function loadFlagTexture(iso2) {
      return new Promise((resolve, reject) => {
        const exts = ['gif', 'png', 'jpg', 'bmp'];
        const basePath = './flag/';
        const loader = new THREE.TextureLoader();
        function tryLoad(i) {
          if (i >= exts.length) {
            reject("국기 로드 실패");
            return;
          }
          const url = `${basePath}${iso2}.${exts[i]}`;
          loader.load(
            url,
            texture => resolve(texture),
            undefined,
            () => tryLoad(i + 1)
          );
        }
        tryLoad(0);
      });
    }

    function disposeObject(obj) {
      obj.traverse(child => {
        if (child.isMesh) {
          child.geometry.dispose();
          if (child.material.map) child.material.map.dispose();
          child.material.dispose();
        }
      });
    }

    function removeOldFlagMesh() {
      if (currentFlagMesh) {
        scene.remove(currentFlagMesh);
        disposeObject(currentFlagMesh);
        currentFlagMesh = null;
      }
    }

    function toLocal2D(ring, cLon, cLat) {
      const degToRad = Math.PI / 180;
      return ring.map(([lon, lat]) => [(lon - cLon) * degToRad, (lat - cLat) * degToRad]);
    }

    function getBoundsCenter(feature) {
      let minLon = 180, maxLon = -180, minLat = 90, maxLat = -90;
      feature.geometry.coordinates.flat(2).forEach(([lon, lat]) => {
        minLon = Math.min(minLon, lon);
        maxLon = Math.max(maxLon, lon);
        minLat = Math.min(minLat, lat);
        maxLat = Math.max(maxLat, lat);
      });
      const centerLon = (minLon + maxLon) / 2;
      const centerLat = (minLat + maxLat) / 2;
      const centerPos = lonLatToXYZ(centerLon, centerLat, globeRadius + 0.02);
      return { minLon, maxLon, minLat, maxLat, centerLon, centerLat, centerPos };
    }

    function polygonToSphereMesh(coordsArray, bounds, radius = globeRadius) {
      const outerRing = coordsArray[0];
      if (!outerRing || outerRing.length < 3) return null;
      const outer2D = toLocal2D(outerRing, bounds.centerLon, bounds.centerLat);
      const verts2D = [], indices = [], uvs = [];

      outer2D.forEach(p => verts2D.push(p[0], p[1]));
      const idx = earcut(verts2D, [], 2);

      const positions = [];
      for (let i = 0; i < idx.length; i++) {
        const index = idx[i];
        const x2D = verts2D[index * 2];
        const y2D = verts2D[index * 2 + 1];
        const lon = bounds.centerLon + (x2D / (Math.PI/180));
        const lat = bounds.centerLat + (y2D / (Math.PI/180));
        const v3 = lonLatToXYZ(lon, lat, radius);
        positions.push(v3.x, v3.y, v3.z);
        const u = (lon - bounds.minLon) / (bounds.maxLon - bounds.minLon);
        const v = (lat - bounds.minLat) / (bounds.maxLat - bounds.minLat);
        uvs.push(u, v);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geometry.computeVertexNormals();
      const material = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6, side: THREE.DoubleSide });
      return new THREE.Mesh(geometry, material);
    }

    async function createFlagShape(feature, iso2) {
      const bounds = getBoundsCenter(feature);
      const meshGroup = new THREE.Group();
      const geom = feature.geometry;

      if (geom.type === 'Polygon') {
        const mesh = polygonToSphereMesh(geom.coordinates, bounds);
        if (mesh) meshGroup.add(mesh);
      } else if (geom.type === 'MultiPolygon') {
        geom.coordinates.forEach(polyCoords => {
          const mesh = polygonToSphereMesh(polyCoords, bounds);
          if (mesh) meshGroup.add(mesh);
        });
      }

      const flagTex = await loadFlagTexture(iso2);
      meshGroup.traverse(obj => {
        if (obj.isMesh) {
          obj.material.map = flagTex;
          obj.material.needsUpdate = true;
        }
      });

      const normal = bounds.centerPos.clone().normalize();
      let tangent = new THREE.Vector3(-normal.y, normal.x, 0);
      if (tangent.length() < 0.0001) tangent = new THREE.Vector3(0, -normal.z, normal.y);
      tangent.normalize();
      const bitangent = new THREE.Vector3().crossVectors(normal, tangent).normalize();
      const basis = new THREE.Matrix4();
      basis.makeBasis(tangent, bitangent, normal);
      meshGroup.setRotationFromMatrix(basis);

      return meshGroup;
    }

    function drawCountryBoundary(feature) {
      const isoA3 = feature.properties.ISO_A3;
      const lineColor = (isoA3 === "KOR") ? 0x0000ff : 0xff0000;
      if (isoA3 !== "KOR" && currentBoundaryLine) {
        scene.remove(currentBoundaryLine);
        disposeObject(currentBoundaryLine);
        currentBoundaryLine = null;
      }
      if (isoA3 === "KOR") {
        if (!koreaBoundaryLine) {
          koreaBoundaryLine = createBoundaryLineGroup(feature);
          scene.add(koreaBoundaryLine);
        }
        return;
      }
      currentBoundaryLine = createBoundaryLineGroup(feature);
      scene.add(currentBoundaryLine);
    }

    function createBoundaryLineGroup(feature) {
      const lineGroup = new THREE.Group();
      const geom = feature.geometry;
      if (!geom) return lineGroup;
      const color = 0xff0000;
      if (geom.type === 'Polygon') {
        geom.coordinates.forEach(ring => {
          const mesh = createBoundaryLineMesh(ring, color);
          if (mesh) lineGroup.add(mesh);
        });
      } else if (geom.type === 'MultiPolygon') {
        geom.coordinates.forEach(poly => {
          poly.forEach(ring => {
            const mesh = createBoundaryLineMesh(ring, color);
            if (mesh) lineGroup.add(mesh);
          });
        });
      }
      return lineGroup;
    }

    function createBoundaryLineMesh(ring, color) {
      if (!ring || ring.length < 2) return null;
      const points = ring.map(([lon, lat]) => lonLatToXYZ(lon, lat, globeRadius + 0.02));
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const material = new THREE.LineBasicMaterial({ color });
      return new THREE.Line(geometry, material);
    }

    function searchCountries() {
      const searchTerm = document.getElementById('iso-code').value.trim().toLowerCase();
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = "";
      const matches = countryGeoJSON.features.filter(f => getCountryName(f).toLowerCase().includes(searchTerm));
      if (matches.length === 0) return resultsDiv.innerHTML = "<div>검색 결과가 없습니다.</div>";
      if (matches.length === 1) {
        document.getElementById('iso-code').value = getCountryName(matches[0]);
        displayCountry(matches[0]);
        resultsDiv.innerHTML = "";
      } else {
        matches.forEach(f => {
          const div = document.createElement('div');
          div.className = "result-item";
          const iso2 = getISO2(f) || "??";
          div.textContent = `${getCountryName(f)} (${iso2})`;
          div.onclick = () => {
            displayCountry(f);
            resultsDiv.innerHTML = "";
            document.getElementById('iso-code').value = getCountryName(f);
          };
          resultsDiv.appendChild(div);
        });
      }
    }

    function displayCountry(feature) {
      drawCountryBoundary(feature);
      const iso2 = getISO2(feature) || "??";
      createFlagShape(feature, iso2).then(mesh => {
        removeOldFlagMesh();
        currentFlagMesh = mesh;
        scene.add(currentFlagMesh);
      });
      const { centerPos } = getBoundsCenter(feature);
      new TWEEN.Tween(camera.position)
        .to({ x: centerPos.x * 2.2, y: centerPos.y * 2.2, z: centerPos.z * 2.2 }, 1000)
        .easing(TWEEN.Easing.Quadratic.Out)
        .onComplete(() => {
          controls.target.set(0, 0, 0);
          controls.update();
        })
        .start();
    }

    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(2, 2, 2);
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);
      controls = new OrbitControls(camera, renderer.domElement);
      controls.update();

      const globeTexture = new THREE.TextureLoader().load('eo_base_2020_clean_geo_optimized.jpg');
      globeMesh = new THREE.Mesh(new THREE.SphereGeometry(globeRadius, 64, 64), new THREE.MeshBasicMaterial({ map: globeTexture }));
      scene.add(globeMesh);

      // ✅ 디버그 포인트 추가 위치는 여기!
      addDebugPoint(126.9780, 37.5665);  // 서울 (경도, 위도)

      fetch('countries.geojson')
        .then(res => res.json())
        .then(data => {
          countryGeoJSON = data;
          document.getElementById('iso-code').value = "south korea";
          searchCountries();
        });

      animate();
    }

    function animate(time) {
      requestAnimationFrame(animate);
      TWEEN.update(time);
      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = init;
    document.getElementById('searchBtn').onclick = searchCountries;
    window.onresize = () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    };
  </script>
</body>
</html>
