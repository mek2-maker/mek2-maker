<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>3D 지구본 (바운딩박스 기반 국기 평면, 투명도 60%)</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <style>
    body { margin: 0; overflow: hidden; }
    #overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.9);
      padding: 10px;
      border-radius: 5px;
      font-family: sans-serif;
      width: 300px;
      max-width: 80vw;
      box-sizing: border-box;
    }
    #results {
      margin-top: 10px;
      max-height: 150px;
      overflow-y: auto;
    }
    .result-item {
      padding: 5px;
      border-bottom: 1px solid #ccc;
      cursor: pointer;
    }
    .result-item:hover {
      background-color: #eee;
    }
    #overlay input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 5px;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <label for="iso-code">국가명 검색 (예: Korea, China):</label>
    <input type="text" id="iso-code" placeholder="국가명을 입력하세요">
    <button id="submit-btn">검색</button>
    <div id="results"></div>
  </div>

  <!-- Three.js 및 관련 모듈 로드 -->
  <script type="module">
    import * as THREE from './libs/three.module.js';
    import { OrbitControls } from './libs/OrbitControls.js';
    import TWEEN from './libs/tween.esm.js';
    import earcut from './libs/earcut.js';

    let scene, camera, renderer, controls;
    const globeRadius = 1;
    let globeMesh;
    let countryGeoJSON = null;

    // 전역에서 국기 평면 및 경계선 Mesh를 보관 (검색 시 이전 것을 제거)
    let currentFlagMesh = null;
    let currentBoundaryLine = null;

    function loadFlagTexture(iso2) {
      return new Promise((resolve, reject) => {
        if (iso2 === "??") {
          return reject("ISO2 코드가 없어 국기 이미지를 찾을 수 없음");
        }
        const exts = ['gif', 'png', 'jpg', 'bmp'];
        const basePath = './flag/';
        const loader = new THREE.TextureLoader();
        
        function tryLoad(i) {
          if (i >= exts.length) {
            reject(`모든 확장자를 시도했으나 '${iso2}' 국기 파일 없음`);
            return;
          }
          const url = `${basePath}${iso2}.${exts[i]}`;
          loader.load(
            url,
            texture => resolve(texture),
            undefined,
            () => tryLoad(i + 1)
          );
        }
        
        tryLoad(0);
      });
    }

    // ISO2, 국가명 헬퍼 함수
    function getISO2(feature) {
      const iso2 = feature.properties.ISO_A2;
      if (!iso2) return null;
      return iso2.trim();
    }
    function getCountryName(feature) {
      return feature.properties.ADMIN;
    }

    // (lon, lat) -> 3D 좌표 변환 (GeoJSON은 [lon, lat] 순서)
    function lonLatToXYZ(lon, lat, radius = globeRadius) {
      const phi = (90 - lat) * (Math.PI / 180);
      const theta = (lon + 180) * (Math.PI / 180);
      const x = -radius * Math.sin(phi) * Math.cos(theta);
      const z =  radius * Math.sin(phi) * Math.sin(theta);
      const y =  radius * Math.cos(phi);
      return new THREE.Vector3(x, y, z);
    }


    function removeOldFlagPlane() {
      if (currentFlagMesh) {
        scene.remove(currentFlagMesh);
        currentFlagMesh.traverse(obj => {
          if (obj.isMesh) {
            obj.geometry.dispose();
            if (obj.material.map) obj.material.map.dispose();
            obj.material.dispose();
          }
        });
        currentFlagMesh = null;
      }
    }
    
    // ---------------------------
    // 국기 평면 생성 함수 (바운딩박스 기반)
    // ---------------------------
    function createFlagPlane(feature, iso2) {
      // feature.geometry가 Polygon 또는 MultiPolygon일 경우 모든 좌표를 순회하여 바운딩박스를 구함
      let minLon = Infinity, maxLon = -Infinity, minLat = Infinity, maxLat = -Infinity;
      
      if (feature.geometry.type === 'Polygon') {
        feature.geometry.coordinates.forEach(ring => {
          ring.forEach(([lon, lat]) => {
            if (lon < minLon) minLon = lon;
            if (lon > maxLon) maxLon = lon;
            if (lat < minLat) minLat = lat;
            if (lat > maxLat) maxLat = lat;
          });
        });
      } else if (feature.geometry.type === 'MultiPolygon') {
        feature.geometry.coordinates.forEach(polygon => {
          polygon.forEach(ring => {
            ring.forEach(([lon, lat]) => {
              if (lon < minLon) minLon = lon;
              if (lon > maxLon) maxLon = lon;
              if (lat < minLat) minLat = lat;
              if (lat > maxLat) maxLat = lat;
            });
          });
        });
      }

      // 중심 (중앙 좌표)
      const centerLon = (minLon + maxLon) / 2;
      const centerLat = (minLat + maxLat) / 2;
      
      // 경도, 위도 차이를 라디안으로 변환하고, 구의 반지름(=1)을 곱해 대략적인 평면 길이로 변환  
      // (단위: 구의 반지름 단위)
      const width = globeRadius * ((maxLon - minLon) * Math.PI / 180);
      const height = globeRadius * ((maxLat - minLat) * Math.PI / 180);

      // PlaneGeometry 생성 (중심을 (0,0)으로 한 평면)
      const planeGeo = new THREE.PlaneGeometry(width, height);
      
      // 국기 텍스처를 로드한 후, 재질과 메쉬 생성 (투명도 60%)
      return loadFlagTexture(iso2).then(flagTexture => {
        const material = new THREE.MeshBasicMaterial({
          map: flagTexture,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.6
        });
        const plane = new THREE.Mesh(planeGeo, material);

        // 평면의 위치: 해당 국가의 중심에 배치 (구의 표면에서 약간 띄워서)
        const centerPos = lonLatToXYZ(centerLon, centerLat, globeRadius + 0.002);
        plane.position.copy(centerPos);

        // 평면을 구의 접평면에 맞게 회전시키기
        // 접평면의 법선은 centerPos의 정규화된 벡터
        const normal = centerPos.clone().normalize();
        // 임의의 접선 벡터 구하기 (normal과 평행하지 않은 벡터 이용)
        let tangent = new THREE.Vector3(-normal.y, normal.x, 0);
        if (tangent.length() < 0.0001) {
          tangent = new THREE.Vector3(0, -normal.z, normal.y);
        }
        tangent.normalize();
        // 법선과 접선으로 두 번째 접선(비탄젠트) 계산
        const bitangent = new THREE.Vector3().crossVectors(normal, tangent).normalize();
        // 접평면의 회전 행렬 생성 (tangent, bitangent, normal을 축으로)
        const basis = new THREE.Matrix4();
        basis.makeBasis(tangent, bitangent, normal);
        plane.setRotationFromMatrix(basis);

        return plane;
      });
    }

    // ---------------------------
    // 초기화 함수
    // ---------------------------
    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(2, 2, 2);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      // OrbitControls (한 번만 생성)
      controls = new OrbitControls(camera, renderer.domElement);
      controls.rotateSpeed = 0.5;
      controls.zoomSpeed   = 1.2;
      controls.panSpeed    = 1.0;
      controls.update();

      // 지구본 텍스처 적용
      const sphereGeometry = new THREE.SphereGeometry(globeRadius, 64, 64);
      const textureLoader = new THREE.TextureLoader();
      const globeTexture = textureLoader.load('eo_base_2020_clean_geo_optimized.jpg');
      const sphereMaterial = new THREE.MeshBasicMaterial({ map: globeTexture });
      globeMesh = new THREE.Mesh(sphereGeometry, sphereMaterial);
      scene.add(globeMesh);

      // GeoJSON 로드
      fetch('countries.geojson')
        .then(response => response.json())
        .then(data => {
          countryGeoJSON = data;
          // 초기 검색어 예시: "China" 또는 "South Korea"
          document.getElementById('iso-code').value = "south korea";
          searchCountries();
        })
        .catch(err => console.error('GeoJSON 로드 실패:', err));

      animate();
    }

    // ---------------------------
    // 메인 애니메이션 루프
    // ---------------------------
    function animate(time) {
      requestAnimationFrame(animate);
      TWEEN.update(time);

      const distance = camera.position.length();
      if (distance < 2.5) {
        controls.panSpeed = 0.3;
      } else if (distance < 4) {
        controls.panSpeed = 0.6;
      } else {
        controls.panSpeed = 1.0;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    // ---------------------------
    // 검색 버튼 기능
    // ---------------------------
    function searchCountries() {
      const searchTerm = document.getElementById('iso-code').value.trim().toLowerCase();
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = "";

      if (!countryGeoJSON) {
        alert("GeoJSON 데이터가 아직 로드되지 않았습니다.");
        return;
      }

      const matches = countryGeoJSON.features.filter(feature => {
        const name = getCountryName(feature).toLowerCase();
        return name.includes(searchTerm);
      });

      if (matches.length === 0) {
        resultsDiv.innerHTML = "<div>검색 결과가 없습니다.</div>";
        return;
      }

      if (matches.length === 1) {
        displayCountry(matches[0]);
        resultsDiv.innerHTML = "";
      } else {
        matches.forEach(feature => {
          const div = document.createElement('div');
          div.className = "result-item";
          const iso2 = getISO2(feature) || "??";
          div.textContent = `${getCountryName(feature)} (${iso2})`;
          div.addEventListener('click', () => {
            displayCountry(feature);
            resultsDiv.innerHTML = "";
            document.getElementById('iso-code').value = getCountryName(feature);
          });
          resultsDiv.appendChild(div);
        });
      }
    }

    // ---------------------------
    // 국가 표시: 경계선 및 국기 평면 생성 + 카메라 이동
    // ---------------------------
    function displayCountry(feature) {
      drawCountryBoundary(feature);

      const iso2 = getISO2(feature) || "??";
      // 새로 생성한 평면 방식으로 국기를 만들고, 이전 국기 Mesh 제거
      createFlagPlane(feature, iso2)
        .then(flagPlane => {
          removeOldFlagPlane();
          currentFlagMesh = flagPlane;
          scene.add(currentFlagMesh);
        })
        .catch(err => console.warn("국기 평면 생성 실패:", err));

      // 카메라 이동: 전체 좌표의 평균(바운딩박스 중심)으로 이동
      let minLon = Infinity, maxLon = -Infinity, minLat = Infinity, maxLat = -Infinity;
      if (feature.geometry.type === 'Polygon') {
        feature.geometry.coordinates.forEach(ring => {
          ring.forEach(([lon, lat]) => {
            if (lon < minLon) minLon = lon;
            if (lon > maxLon) maxLon = lon;
            if (lat < minLat) minLat = lat;
            if (lat > maxLat) maxLat = lat;
          });
        });
      } else if (feature.geometry.type === 'MultiPolygon') {
        feature.geometry.coordinates.forEach(polygon => {
          polygon.forEach(ring => {
            ring.forEach(([lon, lat]) => {
              if (lon < minLon) minLon = lon;
              if (lon > maxLon) maxLon = lon;
              if (lat < minLat) minLat = lat;
              if (lat > maxLat) maxLat = lat;
            });
          });
        });
      }
      const centerLon = (minLon + maxLon) / 2;
      const centerLat = (minLat + maxLat) / 2;
      const centerPos = lonLatToXYZ(centerLon, centerLat, globeRadius + 0.005);
      
      new TWEEN.Tween(camera.position)
        .to({ x: centerPos.x * 2.2, y: centerPos.y * 2.2, z: centerPos.z * 2.2 }, 1000)
        .easing(TWEEN.Easing.Quadratic.Out)
        .onComplete(() => {
          controls.target.set(0, 0, 0);
        })
        .start();
    }

    // ---------------------------
    // 경계선(Line) 표시
    // ---------------------------
    function drawCountryBoundary(feature) {
      const isoA3 = feature.properties.ISO_A3;
      const lineColor = (isoA3 === "KOR") ? 0x0000ff : 0xff0000;

      if (currentBoundaryLine) {
        scene.remove(currentBoundaryLine);
        currentBoundaryLine.traverse(obj => {
          if (obj.isMesh) {
            obj.geometry.dispose();
            obj.material.dispose();
          }
        });
        currentBoundaryLine = null;
      }

      const geom = feature.geometry;
      const lineGroup = new THREE.Group();

      if (geom.type === 'Polygon') {
        geom.coordinates.forEach(ring => {
          const lineMesh = createBoundaryLineMesh(ring, lineColor);
          if (lineMesh) lineGroup.add(lineMesh);
        });
      } else if (geom.type === 'MultiPolygon') {
        geom.coordinates.forEach(polygonCoords => {
          polygonCoords.forEach(ring => {
            const lineMesh = createBoundaryLineMesh(ring, lineColor);
            if (lineMesh) lineGroup.add(lineMesh);
          });
        });
      }
      currentBoundaryLine = lineGroup;
      scene.add(currentBoundaryLine);
    }

    function createBoundaryLineMesh(ring, color) {
      if (!ring || ring.length < 2) return null;
      if (!ring[0].every((val, idx) => val === ring[ring.length - 1][idx])) {
        ring.push(ring[0]);
      }
      const points = ring.map(([lon, lat]) => lonLatToXYZ(lon, lat, globeRadius + 0.005));
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const material = new THREE.LineBasicMaterial({ color });
      return new THREE.Line(geometry, material);
    }  // <-- 추가된 닫는 중괄호
    
    // ---------------------------
    // 이벤트 바인딩
    // ---------------------------
    document.getElementById('submit-btn').addEventListener('click', searchCountries);
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    window.onload = init;
  </script>
</body>
</html>
