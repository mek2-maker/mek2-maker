<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>3D 지구본 (경계선 내부 국기 표시, South Korea 경계 유지)</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
  <style>
    body { margin: 0; overflow: hidden; }
    #overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(255,255,255,0.9);
      padding: 10px;
      border-radius: 5px;
      font-family: sans-serif;
      width: 300px;
      max-width: 80vw;
      box-sizing: border-box;
    }
    #results {
      margin-top: 10px;
      max-height: 150px;
      overflow-y: auto;
    }
    .result-item {
      padding: 5px;
      border-bottom: 1px solid #ccc;
      cursor: pointer;
    }
    .result-item:hover { background-color: #eee; }
    #overlay input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 5px;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <label for="iso-code">국가명 검색 (예: Korea, China):</label>
    <input type="text" id="iso-code" placeholder="국가명을 입력하세요">
    <button id="searchBtn">검색</button>
    <div id="results"></div>
  </div>

  <script type="module">
    import * as THREE from './libs/three.module.js';
    import { OrbitControls } from './libs/OrbitControls.js';
    import TWEEN from './libs/tween.esm.js';
    import earcut from './libs/earcut.js';

    let scene, camera, renderer, controls;
    const globeRadius = 1;
    let globeMesh;
    let countryGeoJSON = null;

    // Mesh 보관
    let currentFlagMesh = null;     // 검색 국가 국기 Shape
    let currentBoundaryLine = null; // 검색 국가 경계선
    let koreaBoundaryLine = null;   // South Korea 경계선은 계속 유지

    // 헬퍼 함수들
    function getISO2(feature) {
      const iso2 = feature.properties.ISO_A2;
      return iso2 ? iso2.trim() : null;
    }
    function getCountryName(feature) {
      return feature.properties.ADMIN;
    }
    function lonLatToXYZ(lon, lat, radius = globeRadius) {
      const phi = (90 - lat) * (Math.PI/180);
      const theta = (lon + 180) * (Math.PI/180);
      const x = -radius * Math.sin(phi) * Math.cos(theta);
      const z = radius * Math.sin(phi) * Math.sin(theta);
      const y = radius * Math.cos(phi);
      return new THREE.Vector3(x, y, z);
    }

    // 국기 텍스처 로드 함수
    function loadFlagTexture(iso2) {
      return new Promise((resolve, reject) => {
        if (iso2 === "??") {
          return reject("ISO2 코드가 없어 국기 이미지를 찾을 수 없음");
        }
        const exts = ['gif','png','jpg','bmp'];
        const basePath = './flag/';
        const loader = new THREE.TextureLoader();
        function tryLoad(i) {
          if (i >= exts.length) {
            reject(`모든 확장자를 시도했으나 '${iso2}' 국기 파일 없음`);
            return;
          }
          const url = `${basePath}${iso2}.${exts[i]}`;
          console.log("Trying to load:", url);
          loader.load(
            url,
            texture => {
              console.log("Loaded flag texture:", url);
              resolve(texture);
            },
            undefined,
            () => {
              console.warn("Failed to load:", url);
              tryLoad(i+1);
            }
          );
        }
        tryLoad(0);
      });
    }

    // 헬퍼 함수: 기존 국기 Mesh 제거
    function removeOldFlagMesh() {
      if (currentFlagMesh) {
        scene.remove(currentFlagMesh);
        disposeObject(currentFlagMesh);
        currentFlagMesh = null;
      }
    }
    function disposeObject(obj) {
      obj.traverse(child => {
        if (child.isMesh) {
          child.geometry.dispose();
          if (child.material.map) child.material.map.dispose();
          child.material.dispose();
        }
      });
    }

    // ---------------------------
    // 국기 Shape 생성 (경계선 ShapeGeometry 기반)
    // ---------------------------
    async function createFlagShape(feature, iso2) {
      console.log("createFlagShape: 시작", feature, iso2);
    
      // 바운딩박스와 중심 좌표 계산 (centerLon, centerLat, centerPos 포함)
      const { minLon, maxLon, minLat, maxLat, centerLon, centerLat, centerPos } = getBoundsCenter(feature);
      console.log("createFlagShape: 경계 box", { minLon, maxLon, minLat, maxLat, centerLon, centerLat, centerPos });
    
      const shapeGroup = new THREE.Group();
      const geom = feature.geometry;
    
      if (geom.type === 'Polygon') {
        const mesh = polygonToShapeMesh(geom.coordinates, { minLon, maxLon, minLat, maxLat, centerLon, centerLat });
        if (mesh) {
          shapeGroup.add(mesh);
          console.log("createFlagShape: Polygon mesh 추가");
        }
      } else if (geom.type === 'MultiPolygon') {
        geom.coordinates.forEach(coordsArray => {
          const mesh = polygonToShapeMesh(coordsArray, { minLon, maxLon, minLat, maxLat, centerLon, centerLat });
          if (mesh) {
            shapeGroup.add(mesh);
            console.log("createFlagShape: MultiPolygon mesh 추가");
          }
        });
      }
    
      // 국기 텍스처 로드
      const flagTex = await loadFlagTexture(iso2);
      console.log("createFlagShape: flagTex 로드 완료", flagTex);
    
      shapeGroup.traverse(obj => {
        if (obj.isMesh) {
          obj.material.map = flagTex;
          obj.material.side = THREE.DoubleSide;
          obj.material.transparent = true;
          obj.material.opacity = 0.6;
          obj.material.needsUpdate = true;
        }
      });
    
      // shapeGroup는 로컬 좌표(국가 중심을 원점)로 만들어졌으므로,
      // 전체를 실제 구 표면상의 위치(centerPos)로 이동
      shapeGroup.position.copy(centerPos);
      const normal = centerPos.clone().normalize();
      let tangent = new THREE.Vector3(-normal.y, normal.x, 0);
      if (tangent.length() < 0.0001) {
        tangent = new THREE.Vector3(0, -normal.z, normal.y);
      }
      tangent.normalize();
      const bitangent = new THREE.Vector3().crossVectors(normal, tangent).normalize();
      const basis = new THREE.Matrix4();
      basis.makeBasis(tangent, bitangent, normal);
      shapeGroup.setRotationFromMatrix(basis);
    
      console.log("createFlagShape: 최종 shapeGroup", shapeGroup);
      return shapeGroup;
    }

    // polygonToShapeMesh: coordsArray → ShapeGeometry Mesh
    // 옵션에 centerLon, centerLat를 포함하여 각 정점에서 빼줌
    function polygonToShapeMesh(coordsArray, { minLon, maxLon, minLat, maxLat, centerLon, centerLat }) {
      if (!coordsArray || coordsArray.length === 0) return null;
      const outerRing = coordsArray[0];
      if (!outerRing || outerRing.length < 3) return null;
      
      // 로컬 좌표 (각 정점에서 중심을 뺌)
      const shape = new THREE.Shape(ringToVector2(outerRing, centerLon, centerLat));
      for (let i = 1; i < coordsArray.length; i++) {
        const holeRing = coordsArray[i];
        if (!holeRing || holeRing.length < 3) continue;
        const holePath = new THREE.Path(ringToVector2(holeRing, centerLon, centerLat));
        shape.holes.push(holePath);
      }
      const shapeGeom = new THREE.ShapeGeometry(shape);
      const posAttr = shapeGeom.getAttribute('position');
      const uvArray = [];
      for (let i = 0; i < posAttr.count; i++) {
        const lon = posAttr.getX(i);
        const lat = posAttr.getY(i);
        // UV 좌표는 원래 좌표계 기준이지만,
        // 여기서는 단순히 min, max 범위로 보정합니다.
        const u = (lon - minLon) / (maxLon - minLon);
        const v = (lat - minLat) / (maxLat - minLat);
        uvArray.push(u, v);
      }
      shapeGeom.setAttribute('uv', new THREE.Float32BufferAttribute(uvArray, 2));
      return new THREE.Mesh(shapeGeom, new THREE.MeshBasicMaterial({ color: 0xffffff }));
    }

    // ringToVector2: 각 정점에서 centerLon, centerLat를 빼서 로컬 2D 좌표를 만듭니다.
    function ringToVector2(ring, centerLon, centerLat) {
      const pts = ring.map(([lon, lat]) => new THREE.Vector2(lon - centerLon, lat - centerLat));
      if (pts.length > 1 && pts[0].equals(pts[pts.length - 1])) {
        pts.pop();
      }
      return pts;
    }

    // getBoundsCenter: 바운딩박스와 중심 3D 좌표 계산 (centerLon, centerLat, centerPos 포함)
    function getBoundsCenter(feature) {
      let minLon = 180, maxLon = -180, minLat = 90, maxLat = -90;
      const geom = feature.geometry;
      if (geom.type === 'Polygon') {
        geom.coordinates.forEach(ring => {
          ring.forEach(([lon, lat]) => {
            if (lon < minLon) minLon = lon;
            if (lon > maxLon) maxLon = lon;
            if (lat < minLat) minLat = lat;
            if (lat > maxLat) maxLat = lat;
          });
        });
      } else if (geom.type === 'MultiPolygon') {
        geom.coordinates.forEach(poly => {
          poly.forEach(ring => {
            ring.forEach(([lon, lat]) => {
              if (lon < minLon) minLon = lon;
              if (lon > maxLon) maxLon = lon;
              if (lat < minLat) minLat = lat;
              if (lat > maxLat) maxLat = lat;
            });
          });
        });
      }
      const centerLon = (minLon + maxLon) / 2;
      const centerLat = (minLat + maxLat) / 2;
      const centerPos = lonLatToXYZ(centerLon, centerLat, globeRadius + 0.02);
      return { minLon, maxLon, minLat, maxLat, centerLon, centerLat, centerPos };
    }

    // ---------------------------
    // 초기화 및 애니메이션
    // ---------------------------
    function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(2, 2, 2);
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);
      controls = new OrbitControls(camera, renderer.domElement);
      controls.rotateSpeed = 0.3;
      controls.zoomSpeed = 1.2;
      controls.panSpeed = 1.0;
      controls.update();

      const sphereGeometry = new THREE.SphereGeometry(globeRadius, 64, 64);
      const textureLoader = new THREE.TextureLoader();
      const globeTexture = textureLoader.load('eo_base_2020_clean_geo_optimized.jpg');
      const sphereMaterial = new THREE.MeshBasicMaterial({ map: globeTexture });
      globeMesh = new THREE.Mesh(sphereGeometry, sphereMaterial);
      scene.add(globeMesh);

      fetch('countries.geojson')
        .then(response => response.json())
        .then(data => {
          countryGeoJSON = data;
          document.getElementById('iso-code').value = "south korea";
          searchCountries();
        })
        .catch(err => console.error('GeoJSON 로드 실패:', err));
      
      animate();
    }

    function animate(time) {
      requestAnimationFrame(animate);
      TWEEN.update(time);
      controls.update();
      renderer.render(scene, camera);
    }

    // ---------------------------
    // 검색 및 국가 표시
    // ---------------------------
    function searchCountries() {
      const searchTerm = document.getElementById('iso-code').value.trim().toLowerCase();
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = "";
      if (!countryGeoJSON) {
        alert("GeoJSON 데이터가 아직 로드되지 않았습니다.");
        return;
      }
      const matches = countryGeoJSON.features.filter(feature => {
        return getCountryName(feature).toLowerCase().includes(searchTerm);
      });
      if (matches.length === 0) {
        resultsDiv.innerHTML = "<div>검색 결과가 없습니다.</div>";
        return;
      }
      if (matches.length === 1) {
        // 단일 검색 결과인 경우, 검색창에 해당 국가의 풀네임을 입력합니다.
        document.getElementById('iso-code').value = getCountryName(matches[0]);
        displayCountry(matches[0]);
        resultsDiv.innerHTML = "";
      } else {
        matches.forEach(feature => {
          const div = document.createElement('div');
          div.className = "result-item";
          const iso2 = getISO2(feature) || "??";
          div.textContent = `${getCountryName(feature)} (${iso2})`;
          div.addEventListener('click', () => {
            displayCountry(feature);
            resultsDiv.innerHTML = "";
            document.getElementById('iso-code').value = getCountryName(feature);
          });
          resultsDiv.appendChild(div);
        });
      }
    }

    function displayCountry(feature) {
      drawCountryBoundary(feature);
    
      const iso2 = getISO2(feature) || "??";
      createFlagShape(feature, iso2)
        .then(flagShape => {
          console.log("displayCountry: 국기 shape 생성 성공", flagShape);
    
          removeOldFlagMesh();
          currentFlagMesh = flagShape;
          scene.add(currentFlagMesh);
    
          // === 디버그용 박스 헬퍼 추가 ===
          const boxHelper = new THREE.BoxHelper(currentFlagMesh, 0xff00ff);
          scene.add(boxHelper);
          console.log("BoxHelper added to scene for debugging.");
    
        })
        .catch(err => console.warn("국기 Shape 생성 실패:", err));

      const { centerPos } = getBoundsCenter(feature);
      new TWEEN.Tween(camera.position)
        .to({ x: centerPos.x * 2.2, y: centerPos.y * 2.2, z: centerPos.z * 2.2 }, 1000)
        .easing(TWEEN.Easing.Quadratic.Out)
        .onComplete(() => { controls.target.set(0, 0, 0); })
        .start();
    }

    // ---------------------------
    // 경계선(Line) 표시 (South Korea는 항상 유지)
    // ---------------------------
    function drawCountryBoundary(feature) {
      const isoA3 = feature.properties.ISO_A3;
      const lineColor = (isoA3 === "KOR") ? 0x0000ff : 0xff0000;
      if (isoA3 !== "KOR" && currentBoundaryLine) {
        scene.remove(currentBoundaryLine);
        disposeObject(currentBoundaryLine);
        currentBoundaryLine = null;
      }
      if (isoA3 === "KOR") {
        if (!koreaBoundaryLine) {
          koreaBoundaryLine = createBoundaryLineGroup(feature);
          scene.add(koreaBoundaryLine);
        }
        return;
      }
      currentBoundaryLine = createBoundaryLineGroup(feature);
      scene.add(currentBoundaryLine);
    }

    function createBoundaryLineGroup(feature) {
      const lineGroup = new THREE.Group();
      const geom = feature.geometry;
      if (!geom) return lineGroup;
      const lineColor = 0xff0000;
      if (geom.type === 'Polygon') {
        geom.coordinates.forEach(ring => {
          const lineMesh = createBoundaryLineMesh(ring, lineColor);
          if (lineMesh) lineGroup.add(lineMesh);
        });
      } else if (geom.type === 'MultiPolygon') {
        geom.coordinates.forEach(poly => {
          poly.forEach(ring => {
            const lineMesh = createBoundaryLineMesh(ring, lineColor);
            if (lineMesh) lineGroup.add(lineMesh);
          });
        });
      }
      return lineGroup;
    }

    function createBoundaryLineMesh(ring, color) {
      if (!ring || ring.length < 2) return null;
      if (!ring[0].every((val, idx) => val === ring[ring.length - 1][idx])) {
        ring.push(ring[0]);
      }
      const points = ring.map(([lon, lat]) => lonLatToXYZ(lon, lat, globeRadius + 0.02));
      const geometry = new THREE.BufferGeometry().setFromPoints(points);
      const material = new THREE.LineBasicMaterial({ color });
      return new THREE.Line(geometry, material);
    }

    window.onload = init;
    document.getElementById('searchBtn').addEventListener('click', searchCountries);
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
