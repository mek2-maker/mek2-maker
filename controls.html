<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Controls</title>
  <style>
    body{margin:0;font-family:sans-serif;padding:10px;}
    #time{font-weight:bold;margin-left:8px;}
  </style>
</head>
<body>
  <input type="range" id="slider" min="0" max="4" value="0">
  <button id="play">Play</button>
  현재: <span id="time">0</span>

  <script>
    const slider = document.getElementById('slider'),
          btn    = document.getElementById('play'),
          lbl    = document.getElementById('time');
    let timer = null;

    const channel = new BroadcastChannel('timesync');

    function updateUI(i) {
      slider.value = i;
      lbl.textContent = i;
    }
    function broadcast(i) {
      channel.postMessage(i);
      updateUI(i);
    }

    slider.oninput = ()=> broadcast(+slider.value);
    btn.onclick = ()=>{
      if (timer) {
        clearInterval(timer);
        timer = null;
        btn.textContent = 'Play';
      } else {
        btn.textContent = 'Pause';
        timer = setInterval(()=>{
          let n = (+slider.value + 1) % ( +slider.max + 1 );
          broadcast(n);
        }, 1000);
      }
    };

    // (선택) 다른 컨텍스트에서 보낸 신호로 UI 동기화
    channel.onmessage = ev => updateUI(ev.data);
  </script>
</body>
</html>
