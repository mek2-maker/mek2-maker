
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Globe – Country Fill Snug</title>
  <style>
    :root {
      --bg-color: #000;
      --panel-bg: rgba(255,255,255,0.95);
      --overlay-bg: rgba(255,255,255,0.90);
      --text-color: #111;
      --subtext-color: #444;
      --input-bg: #fff;
      --input-border: #ccc;
      --button-bg: #007bff;
      --button-bg-hover: #0056b3;
      --button-text: #fff;

      /* 나중에 홀로그램용으로 바꿀 때 아래 값들만 바꾸면 됨
         예:
         --panel-bg: rgba(0,0,0,0.55);
         --overlay-bg: rgba(0,0,0,0.65);
         --text-color: #fff;
         --subtext-color: #bbb;
         --input-bg: rgba(255,255,255,0.08);
         --input-border: rgba(255,255,255,0.25);
      */
    }

    body {
      margin: 0;
      overflow: hidden;
      background: var(--bg-color);
      color: var(--text-color);
      font-family: sans-serif;
    }

    #overlay {
      position: absolute;
      top: 10px;
      left: 10px;
      background: var(--overlay-bg);
      padding: 8px;
      border-radius: 4px;
      z-index: 10;
      display: flex;
      gap: 5px;
      align-items: center;
      backdrop-filter: blur(3px);
    }

    #overlay input {
      width: 140px;
      padding: 4px;
      border: 1px solid var(--input-border);
      border-radius: 3px;
      background: var(--input-bg);
      color: var(--text-color);
    }

    #overlay button {
      padding: 4px 8px;
      border: 1px solid var(--button-bg);
      background-color: var(--button-bg);
      color: var(--button-text);
      border-radius: 3px;
      cursor: pointer;
    }

    #overlay button:hover {
      background-color: var(--button-bg-hover);
    }

    #message {
      margin-left: 10px;
      color: red;
      font-size: 0.9em;
    }

    #info-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 200px;
      display: flex;
      background: var(--panel-bg);
      color: var(--text-color);
      backdrop-filter: blur(3px);
    }

    .info {
      flex: 1;
      padding: 10px;
      text-align: center;
      position: relative;
    }

    .info img {
      max-height: 60px;
      margin-bottom: 6px;
    }

    .time-label {
      font-size: 0.85em;
      margin-bottom: 4px;
      color: var(--subtext-color);
    }
  </style>
</head>
<body>
  <div id="overlay">
    <label for="iso-code" style="display:none;">Country</label>
    <input id="iso-code" placeholder="Enter country name" list="country-names">
    <button id="searchBtn">Search</button>
    <div id="message"></div>
    <datalist id="country-names"></datalist>
  </div>
  <div id="info-panel">
    <div id="left-info" class="info">
      <div class="time-label" id="left-time"></div>
      <div class="info-content" id="left-content"></div>
    </div>
    <div id="right-info" class="info">
      <div class="time-label" id="right-time"></div>
      <div class="info-content" id="right-content"></div>
    </div>
  </div>

  <script type="module">
    import * as THREE from './libs/three.module.js';
    import { OrbitControls } from './libs/OrbitControls.js';
    import earcut from './libs/earcut.js';
    import TWEEN from './libs/tween.esm.js';
    import Papa from 'https://cdn.jsdelivr.net/npm/papaparse@5.3.2/+esm';

    const timeZoneMap = {
      "kr": 9, "ar": -3, "br": -3, "cl": -4, "co": -5, "mx": -6, "pe": -5,
      "bo": -4, "py": -4, "uy": -3, "ec": -5, "gt": -6, "hn": -6, "ni": -6, "pa": -5, "sv": -6, "ve": -4
    };

    function formatTime(offset) {
      const now = new Date();
      const utc = now.getTime() + now.getTimezoneOffset() * 60000;
      const local = new Date(utc + 3600000 * offset);
      return local.toTimeString().split(' ')[0];
    }

    function updateTimeLabels() {
      document.getElementById('left-time').textContent = `Republic of Korea, ${formatTime(9)}`;
      if (window.currentFeature) {
        const iso = window.currentFeature.properties.ISO_A2.toLowerCase();
        const name = window.currentFeature.properties.ADMIN;
        const offset = timeZoneMap[iso] ?? 0;
        document.getElementById('right-time').textContent = `${name}, ${formatTime(offset)}`;
      } else {
        document.getElementById('right-time').textContent = '';
      }
    }

    setInterval(updateTimeLabels, 1000);

    function makeFlagImg(code, alt) {
      const img = document.createElement('img');
      img.alt = alt;
      const upper = code.toUpperCase();
      const exts = ['gif', 'png', 'jpg'];
      let attempt = 0;

      function tryNext() {
        if (attempt >= exts.length) return;
        img.src = `./flag/${upper}.${exts[attempt++]}`;
        img.onerror = tryNext;
      }

      tryNext();
      return img;
    }

    let scene, camera, renderer, controls;
    let geoJSON, infoData;
    
    let baseKRLine = null;
    let baseKRFill = null;
    
    let activeLine = null;
    let activeFill = null;
    
    const R = 1, FILL_R = R + 0.00035, LINE_R = R + 0.00055;
    const LARGE_FILL_CODES = new Set([
      'cn', 'ru', 'us', 'ca', 'br', 'au', 'in', 'id'
    ]);
    const msgDiv = document.getElementById('message');

    function showMessage(msg, type='error') {
      msgDiv.textContent = msg;
      msgDiv.style.color = (type==='error' ? 'red' : 'green');
      setTimeout(() => msgDiv.textContent = '', 3000);
    }

    function animate(time) {
      requestAnimationFrame(animate);
      TWEEN.update(time);
      controls.update();
      renderer.render(scene, camera);
    }

    function lonLatToXYZ(lon, lat, r = R) {
      const φ = (90 - lat) * Math.PI / 180;
      const θ = (lon + 180) * Math.PI / 180;
      return new THREE.Vector3(-r * Math.sin(φ) * Math.cos(θ), r * Math.cos(φ), r * Math.sin(φ) * Math.sin(θ));
    }

    function getCenterOfFeature(f) {
      const coords = f.geometry.type === 'Polygon'
        ? f.geometry.coordinates.flat()
        : f.geometry.coordinates.flat(2);
      let [minLon, maxLon, minLat, maxLat] = [180, -180, 90, -90];
      coords.forEach(([lon, lat]) => {
        minLon = Math.min(minLon, lon);
        maxLon = Math.max(maxLon, lon);
        minLat = Math.min(minLat, lat);
        maxLat = Math.max(maxLat, lat);
      });
      return { centerLon: (minLon + maxLon) / 2, centerLat: (minLat + maxLat) / 2 };
    }
    
    function vectorToLonLat(v) {
      const nv = v.clone().normalize();
      const lat = THREE.MathUtils.radToDeg(Math.asin(nv.y));
      const lon = THREE.MathUtils.radToDeg(Math.atan2(-nv.z, nv.x));
      return { centerLon: lon, centerLat: lat };
    }
    
    function getPolygonApproxCenter(poly) {
      const outer = poly[0];
      if (!outer || !outer.length) return { centerLon: 0, centerLat: 0 };
    
      const acc = new THREE.Vector3(0, 0, 0);
    
      outer.forEach(([lon, lat]) => {
        acc.add(lonLatToXYZ(lon, lat, 1));
      });
    
      if (acc.lengthSq() < 1e-12) {
        return { centerLon: 0, centerLat: 0 };
      }
    
      return vectorToLonLat(acc);
    }
    
    function getLocalBasis(centerLon, centerLat) {
      const center = lonLatToXYZ(centerLon, centerLat, 1).normalize();
    
      const worldUp = new THREE.Vector3(0, 1, 0);
      let east = new THREE.Vector3().crossVectors(worldUp, center);
    
      // 극지방 근처 안전장치
      if (east.lengthSq() < 1e-10) {
        east = new THREE.Vector3(1, 0, 0).cross(center);
      }
      east.normalize();
    
      const north = new THREE.Vector3().crossVectors(center, east).normalize();
    
      return { center, east, north };
    }
    
    function projectLonLatToLocal2D(lon, lat, basis, scale = 1.0) {
      const p = lonLatToXYZ(lon, lat, 1);
      return [
        p.dot(basis.east) * scale,
        p.dot(basis.north) * scale
      ];
    }
    
    function unwrapRingLongitudes(ring, refLon) {
      const out = [];
      let prev = null;
    
      ring.forEach(([lon, lat], idx) => {
        let x = lon;
    
        if (idx === 0) {
          while (x - refLon > 180) x -= 360;
          while (x - refLon < -180) x += 360;
        } else {
          while (x - prev > 180) x -= 360;
          while (x - prev < -180) x += 360;
        }
    
        out.push([x, lat]);
        prev = x;
      });
    
      return out;
    }

    function wrapLon(lon) {
      let x = lon;
      while (x > 180) x -= 360;
      while (x < -180) x += 360;
      return x;
    }
    
    function pointInRing2D(x, y, ring) {
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const xi = ring[i][0], yi = ring[i][1];
        const xj = ring[j][0], yj = ring[j][1];
    
        const intersect =
          ((yi > y) !== (yj > y)) &&
          (x < (xj - xi) * (y - yi) / ((yj - yi) || 1e-12) + xi);
    
        if (intersect) inside = !inside;
      }
      return inside;
    }
    
    function pointInPolygonWithHoles(x, y, rings) {
      if (!rings || !rings.length) return false;
      if (!pointInRing2D(x, y, rings[0])) return false;
    
      for (let i = 1; i < rings.length; i++) {
        if (pointInRing2D(x, y, rings[i])) return false;
      }
      return true;
    }
    
    function buildGridFillMeshForPolygon(poly, color, stepDeg = 1) {
      if (!poly || !poly.length || !poly[0] || poly[0].length < 3) return null;
    
      const { centerLon, centerLat } = getPolygonApproxCenter(poly);
      const rings = poly.map(ring => unwrapRingLongitudes(ring, centerLon));
    
      let minLon = Infinity, maxLon = -Infinity, minLat = Infinity, maxLat = -Infinity;
      rings.forEach(ring => {
        ring.forEach(([lon, lat]) => {
          minLon = Math.min(minLon, lon);
          maxLon = Math.max(maxLon, lon);
          minLat = Math.min(minLat, lat);
          maxLat = Math.max(maxLat, lat);
        });
      });
    
      if (!isFinite(minLon) || !isFinite(maxLon) || !isFinite(minLat) || !isFinite(maxLat)) {
        return null;
      }
    
      const pos = [];
    
      for (let lat = minLat; lat < maxLat; lat += stepDeg) {
        for (let lon = minLon; lon < maxLon; lon += stepDeg) {
          const cx = lon + stepDeg * 0.5;
          const cy = lat + stepDeg * 0.5;
    
          if (!pointInPolygonWithHoles(cx, cy, rings)) continue;
    
          const p1 = lonLatToXYZ(wrapLon(lon),               lat,               FILL_R);
          const p2 = lonLatToXYZ(wrapLon(lon + stepDeg),     lat,               FILL_R);
          const p3 = lonLatToXYZ(wrapLon(lon + stepDeg),     lat + stepDeg,     FILL_R);
          const p4 = lonLatToXYZ(wrapLon(lon),               lat + stepDeg,     FILL_R);
    
          // triangle 1
          pos.push(p1.x, p1.y, p1.z);
          pos.push(p2.x, p2.y, p2.z);
          pos.push(p3.x, p3.y, p3.z);
    
          // triangle 2
          pos.push(p1.x, p1.y, p1.z);
          pos.push(p3.x, p3.y, p3.z);
          pos.push(p4.x, p4.y, p4.z);
        }
      }
    
      if (!pos.length) return null;
    
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geom.computeVertexNormals();
    
      return new THREE.Mesh(
        geom,
        new THREE.MeshBasicMaterial({
          color,
          transparent: true,
          opacity: 0.34,
          side: THREE.DoubleSide,
          depthTest: true,
          depthWrite: false,
          polygonOffset: true,
          polygonOffsetFactor: -1,
          polygonOffsetUnits: -1
        })
      );
    }
    
    function buildGridFillMesh(feature, color) {
      const grp = new THREE.Group();
      const polys = feature.geometry.type === 'Polygon'
        ? [feature.geometry.coordinates]
        : feature.geometry.coordinates;
    
      const code = (feature.properties.ISO_A2 || '').toLowerCase();
    
      let stepDeg = 1.0;
      if (code === 'cn' || code === 'us' || code === 'in') stepDeg = 0.5;
      if (code === 'ru' || code === 'ca') stepDeg = 0.8;
    
      polys.forEach(poly => {
        const mesh = buildGridFillMeshForPolygon(poly, color, stepDeg);
        if (mesh) grp.add(mesh);
      });
    
      return grp;
    }
    
    function buildFillMeshForPolygon(poly, color) {
      if (!poly || !poly.length || !poly[0] || poly[0].length < 3) return null;
    
      const { centerLon, centerLat } = getPolygonApproxCenter(poly);
      const basis = getLocalBasis(centerLon, centerLat);
    
      const rings2D = poly.map(ring =>
        ring.map(([lon, lat]) => projectLonLatToLocal2D(lon, lat, basis, 1.0))
      );
    
      const verts2D = [];
      const holes = [];
    
      rings2D.forEach((ring, i) => {
        if (!ring || ring.length < 3) return;
        if (i > 0) holes.push(verts2D.length / 2);
        ring.forEach(([x, y]) => verts2D.push(x, y));
      });
    
      if (verts2D.length < 6) return null;
    
      const idxs = earcut(verts2D, holes, 2);
      if (!idxs || !idxs.length) return null;
    
      const pos = [];
      idxs.forEach(id => {
        const x = verts2D[2 * id];
        const y = verts2D[2 * id + 1];
    
        const v = basis.center.clone()
          .addScaledVector(basis.east, x)
          .addScaledVector(basis.north, y)
          .normalize()
          .multiplyScalar(FILL_R);
    
        pos.push(v.x, v.y, v.z);
      });
    
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geom.computeVertexNormals();
    
      return new THREE.Mesh(
        geom,
        new THREE.MeshBasicMaterial({
          color,
          transparent: true,
          opacity: 0.30,
          side: THREE.DoubleSide,
          depthTest: true,
          depthWrite: false,
          polygonOffset: true,
          polygonOffsetFactor: -1,
          polygonOffsetUnits: -1
        })
      );
    }    
  
    function shouldUseSafeFill(feature) {
      const code = (feature.properties.ISO_A2 || '').toLowerCase();
    
      const blocked = new Set([
      ]);
    
      if (blocked.has(code)) return false;
    
      const polys = feature.geometry.type === 'Polygon'
        ? [feature.geometry.coordinates]
        : feature.geometry.coordinates;
    
      if (polys.length > 1200) return false;
    
      return true;
    }
    
    function drawBoundary(feature, color) {
      const grp = new THREE.Group();
      const polys = feature.geometry.type === 'Polygon'
        ? [feature.geometry.coordinates]
        : feature.geometry.coordinates;
      polys.forEach(poly => poly.forEach(ring => {
        const pts = ring.map(([lon, lat]) => lonLatToXYZ(lon, lat, LINE_R));
        if (pts.length && !pts[0].equals(pts[pts.length - 1])) pts.push(pts[0].clone());
        const geom = new THREE.BufferGeometry().setFromPoints(pts);
        grp.add(new THREE.Line(geom, new THREE.LineBasicMaterial({ color })));
      }));
      return grp;
    }

    function drawFill(feature, color) {
      const code = (feature.properties.ISO_A2 || '').toLowerCase();
    
      // 큰 국가는 grid 기반 fill
      if (LARGE_FILL_CODES.has(code)) {
        return buildGridFillMesh(feature, color);
      }
    
      // 나머지는 기존 earcut 기반 fill
      const grp = new THREE.Group();
      const polys = feature.geometry.type === 'Polygon'
        ? [feature.geometry.coordinates]
        : feature.geometry.coordinates;
    
      polys.forEach(poly => {
        const mesh = buildFillMeshForPolygon(poly, color);
        if (mesh) grp.add(mesh);
      });
    
      return grp;
    }
    
    function setBaseKorea(feature) {
      if (baseKRLine) scene.remove(baseKRLine);
      if (baseKRFill) scene.remove(baseKRFill);
    
      baseKRLine = drawBoundary(feature, 0x0000ff);
      baseKRFill = drawFill(feature, 0x0000ff);
    
      baseKRFill.traverse(obj => {
        if (obj.isMesh && obj.material) {
          obj.material.opacity = 0.28;
        }
      });
    
      scene.add(baseKRLine, baseKRFill);
    }
    
    function updateLeftPanel() {
      const el = document.getElementById('left-content');
      el.innerHTML = '';
      const kor = infoData.find(i => i.iso2 === 'kr');
      if (!kor) return;
      el.appendChild(makeFlagImg('kr', 'Republic of Korea'));
      el.insertAdjacentHTML('beforeend', `<strong>Republic of Korea</strong><br>Capital: ${kor.capital}<br>Area: ${kor.area_km2.toLocaleString()} km²<br>Pop: ${kor.pop_jul_total.toLocaleString()}<br>GDP: ${kor.gdp.toLocaleString()} $`);
    }

    function updateRightPanel(feature) {
      const el = document.getElementById('right-content');
      el.innerHTML = '';
      const code = feature.properties.ISO_A2.toLowerCase();
      const info = infoData.find(i => i.iso2 === code);
      if (!info) return;
      const name = code === 'kr' ? 'Republic of Korea' : info.eng_name;
      el.appendChild(makeFlagImg(code, name + ' Flag'));
      el.insertAdjacentHTML('beforeend', `<strong>${name}</strong><br>Capital: ${info.capital}<br>Area: ${info.area_km2.toLocaleString()} km²<br>Pop: ${info.pop_jul_total.toLocaleString()}<br>GDP: ${info.gdp.toLocaleString()} $`);
    }

    function displayCountry(feature) {
      if (!feature) {
        showMessage('Country not found', 'error');
        return;
      }
    
      showMessage(`${feature.properties.ADMIN} selected`, 'success');
    
      if (activeLine) scene.remove(activeLine);
      if (activeFill) scene.remove(activeFill);
      activeLine = null;
      activeFill = null;
    
      const isKR = feature.properties.ISO_A2.toLowerCase() === 'kr';
    
      // 한국은 기본 레이어로 유지하므로 active 레이어는 생략
      if (!isKR) {
        activeLine = drawBoundary(feature, 0xff0000);
        scene.add(activeLine);
    
        if (shouldUseSafeFill(feature)) {
          activeFill = drawFill(feature, 0xff0000);
          scene.add(activeFill);
          console.log('[FILL] enabled for', feature.properties.ADMIN);
        } else {
          console.log('[FILL] skipped for', feature.properties.ADMIN);
        }
      }
    
      window.currentFeature = feature;
    
      updateLeftPanel();
      updateRightPanel(feature);
    
      const { centerLon, centerLat } = getCenterOfFeature(feature);
      const tgt = lonLatToXYZ(centerLon, centerLat, R + 1.5);
    
      new TWEEN.Tween(camera.position)
        .to({ x: tgt.x, y: tgt.y, z: tgt.z }, 800)
        .easing(TWEEN.Easing.Quadratic.Out)
        .onUpdate(() => {
          camera.lookAt(0, 0, 0);
        })
        .onComplete(() => {
          camera.lookAt(0, 0, 0);
        })
        .start();
    }

    async function init() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true; controls.dampingFactor = 0.05;
      controls.rotateSpeed = 0.3;
      const tex = new THREE.TextureLoader().load('eo_base_2020_clean_geo_optimized.jpg');
      scene.add(new THREE.Mesh(new THREE.SphereGeometry(R, 64, 64), new THREE.MeshBasicMaterial({ map: tex })));
      const csvText = await fetch('country_info_198.csv').then(r => r.text());
      infoData = Papa.parse(csvText, {
        header: true,
        skipEmptyLines: true,
        transformHeader: h => h.replace(/^﻿/, '').trim().toLowerCase()
      }).data.map(r => ({ iso2: r.iso2.toLowerCase(), eng_name: r.eng_name, area_km2: +r.area_km2 || 0, pop_jul_total: +r.pop_jul_total || 0, gdp: +r.gdp || 0, capital: r.capital }));
      geoJSON = await fetch('countries.geojson').then(r => r.json());
      
      const korF = geoJSON.features.find(f => f.properties.ADMIN.toLowerCase().includes('korea'));
      setBaseKorea(korF);
      
      const dl = document.getElementById('country-names');
      geoJSON.features.forEach(f => {
        const opt = document.createElement('option');
        opt.value = f.properties.ADMIN;
        dl.appendChild(opt);
      });
      
      window.currentFeature = korF;
      updateLeftPanel();
      updateRightPanel(korF);
      
      const { centerLon, centerLat } = getCenterOfFeature(korF);
      camera.position.copy(lonLatToXYZ(centerLon, centerLat, R + 1.5));
      camera.lookAt(0, 0, 0);
      controls.target.set(0, 0, 0);
      document.getElementById('searchBtn').onclick = () => {
        const q = document.getElementById('iso-code').value.trim().toLowerCase();
        let f = geoJSON.features.find(ff => ff.properties.ADMIN.toLowerCase() === q);
        if (!f) f = geoJSON.features.find(ff => ff.properties.ADMIN.toLowerCase().includes(q));
        displayCountry(f);
      };
      animate();
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    window.onload = init;
  </script>
</body>
</html>
