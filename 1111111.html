<div class="blink-marker" style="--size: 15px; --color: #ff4d4d;"></div>

<style>
/* 페이지 기본 여백 제거 */
html, body { margin:0; padding:0; }

/* 전체 투명 캔버스 */
.blink-marker{
  position: fixed; inset: 0; pointer-events: none;
  /* 퍼지는 링이 var(--size)*1.4 → 반지름이 var(--size)*0.7
     그만큼 안쪽으로 중심 이동 */
  --pad: calc(var(--size) * 0.7);
}

/* 두 링 중심 같게 */
.blink-marker::before, .blink-marker::after{
  content:""; position:absolute;
  left: var(--pad); top: var(--pad);
  transform: translate(-50%, -50%);
  border-radius: 50%;
  pointer-events:none;
}

/* 고정 링 */
.blink-marker::before{
  width: var(--size); height: var(--size);
  box-shadow: 0 0 0 2px var(--color) inset;
  background: transparent;
}

/* 퍼지면서 깜빡이는 링 (size*1.4 기준) */
.blink-marker::after{
  width: calc(var(--size) * 1.4); height: calc(var(--size) * 1.4);
  box-shadow: 0 0 0 2px var(--color) inset;
  animation: pulse 1.2s ease-out infinite;
  opacity: .9;
}

@keyframes pulse{
  0%{ transform: translate(-50%, -50%) scale(0.7); opacity: .9; }
  70%{ transform: translate(-50%, -50%) scale(1.3); opacity: 0; }
  100%{ transform: translate(-50%, -50%) scale(1.3); opacity: 0; }
}
</style>
