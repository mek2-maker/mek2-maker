<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>시도 경계 지도</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; height: 100%; }
    #map { width: 100%; height: 100%; }

    #fixed-image-box {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 200px;
      background: white;
      border: 2px solid #444;
      padding: 10px;
      z-index: 999;
      box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.3);
      font-family: sans-serif;
    }

    #fixed-image-box img {
      width: 100%;
      height: auto;
      max-width: 100%;
    }

    .leaflet-interactive:focus {
      outline: none !important;
    }
  </style>
</head>
<body>
<div id="map"></div>
<div id="fixed-image-box"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map', {
    minZoom: 6,
    maxZoom: 6,
    scrollWheelZoom: false,
    dragging: true,
    boxZoom: false
  }).setView([40, 127.8], 6);

  // ✅ 패닝으로 시각적으로 대한민국을 아래로 보이게
  setTimeout(() => {
    map.panBy([0, -100]);  // Y축 위로 100px만큼 이동
  }, 200);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  const nameToFileMap = {
    "서울특별시": "Seoul.jpg",
    "부산광역시": "Busan.jpg",
    "대구광역시": "Daegu.jpg",
    "인천광역시": "Incheon.jpg",
    "광주광역시": "Gwangju.jpg",
    "대전광역시": "Daejeon.jpg",
    "울산광역시": "Ulsan.jpg",
    "세종특별자치시": "Sejong.jpg",
    "경기도": "Gyeonggi-do.jpg",
    "강원도": "Gangwon State.jpg",
    "충청북도": "Chungcheongbuk-do.jpg",
    "충청남도": "Chungcheongnam-do.jpg",
    "전라북도": "Jeonbuk State.jpg",
    "전라남도": "Jeollanam-do.jpg",
    "경상북도": "Gyeongsangbuk-do.jpg",
    "경상남도": "Gyeongsangnam-do.jpg",
    "제주특별자치도": "Jeju Special Self-Governing Province.jpg"
  };


  const regionColors = {
    "Seoul": "rgb(0, 159, 232)",
    "Busan": "rgb(230, 61, 125)",
    "Daegu": "rgb(195, 212, 36)",
    "Incheon": "rgb(199, 159, 98)",
    "Gwangju": "rgb(184, 99, 162)",
    "Daejeon": "rgb(127, 16, 131)",
    "Ulsan": "rgb(242, 150, 0)",
    "Sejong": "rgb(252, 208, 5)",
    "Gyeonggi-do": "rgb(81, 138, 65)",
    "Chungcheongnam-do": "rgb(96, 187, 140)",
    "Chungcheongbuk-do": "rgb(95, 169, 179)",
    "Jeollanam-do": "rgb(0, 117, 193)",
    "Jeonbuk State": "rgb(50, 53, 122)",
    "Gyeongsangnam-do": "rgb(0, 161, 153)",
    "Gyeongsangbuk-do": "rgb(229, 101, 86)",
    "Gangwon State": "rgb(180, 26, 61)",
    "Jeju Special Self-Governing Province": "rgb(180, 124, 54)"
  };

  fetch('남한_17시도_wgs84.geojson')
    .then(res => res.json())
    .then(data => {
      L.geoJSON(data, {
        style: () => ({
          color: "black",
          weight: 2,
          fillOpacity: 0
        }),
        onEachFeature: function (feature, layer) {
          const korName = feature.properties.sd_name;
          const fileName = nameToFileMap[korName];
          const fillColor = regionColors[fileName?.replace(".jpg", "").replace("_1", "")] || "#cccccc";

          layer.on("mouseover", () => {
            layer.setStyle({
              fillColor: fillColor,
              fillOpacity: 1.0
            });
          });

          layer.on("mouseout", () => {
            layer.setStyle({ fillOpacity: 0 });
          });

          layer.on("click", () => {
            const box = document.getElementById("fixed-image-box");
            if (fileName) {
              box.innerHTML = `<h4>${korName}</h4><img src="sido/${fileName}" alt="${korName}">`;
            } else {
              box.innerHTML = `<h4>${korName}</h4><p>이미지 없음</p>`;
            }
          });
        }
      }).addTo(map);
    });
</script>
</body>
</html>
